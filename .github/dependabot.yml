version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # semgrep pins opentelemetry-api ~=1.37.0, so a bump breaks every Python job.
      # Drop this with the CVE-2026-114603 and CVE-2026-126360 pip-audit exceptions.
      - dependency-name: opentelemetry-api
      # semgrep pins mcp ==1.29.0 exactly, so a bump cannot install. Drop this with the
      # mcp pip-audit exceptions.
      - dependency-name: mcp
      # semgrep pins wcmatch ~=8.3, so a bump cannot install. Drop this with the
      # CVE-2026-132276 pip-audit exception.
      - dependency-name: wcmatch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
