name: Cache cleanup

# A pull request's Actions caches live under its own merge ref and cannot be
# restored from master, but they count against the repository's cache quota and
# push out the caches master does use. Delete them when the pull request closes.
# The job runs no repository code and uses no actions: it only calls the gh CLI.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete the pull request's caches
    # Fork and Dependabot pull requests get a read-only token, which cannot delete caches.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Deleting a cache needs actions: write; nothing else is granted.
      actions: write
    steps:
      - name: Delete caches of the pull request ref
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PULL_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          ids=$(gh cache list --ref "$PULL_REF" --limit 100 --json id --jq '.[].id')
          for id in $ids; do
            gh cache delete "$id"
          done
