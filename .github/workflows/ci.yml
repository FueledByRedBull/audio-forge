name: CI

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RUSTFLAGS: -C debuginfo=0

jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-python-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-python-
      - name: Install Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Audit locked Python dependencies
        run: |
          python -m pip_audit --require-hashes -r requirements/runtime.txt
          # Semgrep 1.171.0 currently pins mcp==1.23.3 for its optional
          # `semgrep mcp` server. This repository only invokes `semgrep scan`;
          # keep the upstream IDs explicit until Semgrep publishes a compatible
          # MCP pin rather than hiding unrelated audit results.
          python -m pip_audit --require-hashes -r requirements/dev.txt `
            --ignore-vuln PYSEC-2026-3481 `
            --ignore-vuln PYSEC-2026-3482 `
            --ignore-vuln PYSEC-2026-3483
      - name: Ruff
        run: python -m ruff check python/mic_eq python/tests python/tools
      - name: Pyright
        run: python -m pyright
      - name: Version check
        run: python python/tools/check_versions.py
      - name: Workflow definition check
        run: python python/tools/check_workflows.py
      - name: Package source smoke
        run: python python/tools/package_smoke.py --source-only
      - name: Pytest
        run: python -m pytest python/tests -q
      - name: Semgrep
        run: python python/tools/run_semgrep.py --sarif semgrep-results.sarif
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: semgrep-results.sarif
          if-no-files-found: error
          retention-days: 14

  rust:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rust-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-rust-
      - name: Rust format
        run: cargo fmt --check
      - name: RustSec audit
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # master, Node 24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download pinned Silero contract model
        run: |
          $asset = (Get-Content release-assets.json | ConvertFrom-Json).assets |
            Where-Object { $_.path -eq "models/silero_vad.onnx" }
          if (-not $asset -or $asset.source -notmatch "^https://") {
            throw "release-assets.json does not define a direct Silero model source."
          }
          New-Item -ItemType Directory -Force -Path models | Out-Null
          Invoke-WebRequest -Uri $asset.source -OutFile $asset.path
          $actualHash = (Get-FileHash -LiteralPath $asset.path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $asset.sha256) {
            throw "Silero model hash mismatch: $actualHash"
          }
      - name: Rust tests
        run: cargo test -p mic_eq_core
      - name: Release-mode control/DSP contention stress
        run: cargo test --release -p mic_eq_core --test stress_tests seeded_control_and_dsp_loops_remain_finite_under_contention
      - name: Clippy
        run: cargo clippy -p mic_eq_core --all-targets -- -D warnings
