name: CI

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RUSTFLAGS: -C debuginfo=0

jobs:
  # Required status check. Runs even when a part fails, is skipped or is
  # cancelled, and fails unless every part succeeded.
  python:
    needs: [static, pytest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STATIC_RESULT: ${{ needs.static.result }}
      PYTEST_RESULT: ${{ needs.pytest.result }}
    steps:
      - name: Require every Python job to succeed
        run: |
          echo "static: $STATIC_RESULT, pytest: $PYTEST_RESULT"
          [[ "$STATIC_RESULT" == success && "$PYTEST_RESULT" == success ]]

  # Required status check, same rule as python.
  rust:
    needs: [rust-tests, rust-stress]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
      RUST_STRESS_RESULT: ${{ needs.rust-stress.result }}
    steps:
      - name: Require every Rust job to succeed
        run: |
          echo "rust-tests: $RUST_TESTS_RESULT, rust-stress: $RUST_STRESS_RESULT"
          [[ "$RUST_TESTS_RESULT" == success && "$RUST_STRESS_RESULT" == success ]]

  static:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Version check
        run: python python/tools/check_versions.py
      - name: Evaluation evidence hygiene
        run: python python/tools/check_evaluation_hygiene.py
      - name: Install Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt --no-compile
          if ($LASTEXITCODE -ne 0) { throw "Dependency install failed with exit code $LASTEXITCODE." }
      - name: Audit locked Python dependencies
        run: |
          python -m pip_audit --require-hashes -r requirements/runtime.txt --disable-pip
          if ($LASTEXITCODE -ne 0) { throw "Runtime dependency audit failed with exit code $LASTEXITCODE." }
          # semgrep pins mcp==1.29.0 exactly, so the dev lock cannot move off
          # CVE-2026-59951. Only semgrep's MCP server uses mcp and nothing here
          # runs it. Remove the ignore when semgrep allows mcp>=1.30.0.
          python -m pip_audit --require-hashes -r requirements/dev.txt --disable-pip --ignore-vuln CVE-2026-59951
          if ($LASTEXITCODE -ne 0) { throw "Development dependency audit failed with exit code $LASTEXITCODE." }
      - name: Ruff
        run: python -m ruff check python/mic_eq python/tests python/tools
      # Reads mic_eq_core.pyi; the built extension is not needed.
      - name: Pyright
        run: python -m pyright
      - name: Workflow definition check
        run: python python/tools/check_workflows.py
      - name: Package source smoke
        run: python python/tools/package_smoke.py --source-only
      - name: Semgrep
        run: python python/tools/run_semgrep.py --sarif semgrep-results.sarif
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: semgrep-results.sarif
          if-no-files-found: error
          retention-days: 14
      - name: Upload Semgrep results to GitHub Code Scanning
        if: always() && github.event_name == 'push' && hashFiles('semgrep-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  # Every test file runs exactly once: the shards in .github/pytest-shards.json
  # run their listed files and the last shard runs all other files.
  pytest:
    name: pytest (${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [voice-setup, voice-flow, auto-eq, quick-ui, tooling, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt --no-compile
          if ($LASTEXITCODE -ne 0) { throw "Dependency install failed with exit code $LASTEXITCODE." }
      - name: Hydrate pinned CPU ONNX Runtime
        run: |
          python python/tools/fetch_release_assets.py --only-cpu-runtime --force
          if ($LASTEXITCODE -ne 0) { throw "CPU ONNX Runtime hydration failed with exit code $LASTEXITCODE." }
      # The key covers every input of the native build, including the workflow
      # (RUSTFLAGS); there is deliberately no restore-keys fallback.
      - name: Restore native module
        id: native
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: python/mic_eq/mic_eq_core*.pyd
          key: ${{ runner.os }}-${{ runner.arch }}-native-v1-py${{ steps.python.outputs.python-version }}-${{ hashFiles('rust-core/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'pyproject.toml', 'release-assets.json', '.github/workflows/ci.yml') }}
      - if: steps.native.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned 1.94.0
        with:
          toolchain: 1.94.0
      - if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-python-v3-py313-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'Cargo.toml', 'rust-core/Cargo.toml', 'pyproject.toml') }}
      - name: Build native module
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { throw "Editable install failed with exit code $LASTEXITCODE." }
      # What the editable install provides to tests and their subprocesses, so
      # a restored native module needs no build.
      - name: Make the source tree importable
        run: |
          $site = python -c "import sysconfig; print(sysconfig.get_path('purelib'))"
          if ($LASTEXITCODE -ne 0) { throw "Could not locate site-packages." }
          Set-Content -LiteralPath (Join-Path $site "mic_eq.pth") -Value "$env:GITHUB_WORKSPACE\python" -Encoding ascii
      # Without the module the native tests skip instead of failing.
      - name: Verify native module
        run: python -c "import mic_eq; assert mic_eq.CORE_AVAILABLE, mic_eq._CORE_IMPORT_ERROR"
      - name: Save native module
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: python/mic_eq/mic_eq_core*.pyd
          key: ${{ steps.native.outputs.cache-primary-key }}
      - name: Pytest
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          $shards = Get-Content -Raw .github/pytest-shards.json | ConvertFrom-Json
          $listed = @($shards.PSObject.Properties | ForEach-Object { $_.Value })
          if ($env:SHARD -eq "rest") {
            $targets = @("python/tests") + @($listed | ForEach-Object { "--ignore=$_" })
          } else {
            $targets = @($shards.PSObject.Properties | Where-Object { $_.Name -eq $env:SHARD } | ForEach-Object { $_.Value })
            if ($targets.Count -eq 0) { throw "Unknown pytest shard $env:SHARD." }
          }
          python -m pytest @targets -q --durations=15

  rust-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements/runtime.txt
      - name: Install locked runtime for native Python bridge tests
        run: |
          python -m pip install --require-hashes -r requirements/runtime.txt --no-compile
          if ($LASTEXITCODE -ne 0) { throw "Runtime dependency install failed with exit code $LASTEXITCODE." }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned 1.94.0
        with:
          toolchain: 1.94.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-rust-test-v1-py313-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'Cargo.toml', 'rust-core/Cargo.toml') }}
      - name: Hydrate pinned CPU ONNX Runtime
        run: |
          python python/tools/fetch_release_assets.py --only-cpu-runtime --force
          if ($LASTEXITCODE -ne 0) { throw "CPU ONNX Runtime hydration failed with exit code $LASTEXITCODE." }
      - name: Rust format
        run: cargo fmt --check
      - name: Cache pinned cargo-audit and advisory database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-audit.exe
            ~/.cargo/advisory-db
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-audit-0.22.2
      - name: Install pinned cargo-audit
        run: |
          $audit = Join-Path $env:USERPROFILE ".cargo/bin/cargo-audit.exe"
          $version = ""
          if (Test-Path -LiteralPath $audit) { $version = & $audit --version | Out-String }
          if ($version -notmatch "0\.22\.2") {
            cargo install cargo-audit --version 0.22.2 --locked --force
            if ($LASTEXITCODE -ne 0) { throw "cargo-audit installation failed with exit code $LASTEXITCODE." }
          }
          $version = & $audit --version | Out-String
          if ($LASTEXITCODE -ne 0 -or $version -notmatch "0\.22\.2") { throw "cargo-audit 0.22.2 is not available." }
      - name: RustSec audit
        run: |
          cargo audit --deny warnings
          if ($LASTEXITCODE -ne 0) { throw "RustSec audit failed with exit code $LASTEXITCODE." }
          # DeepFilter is an independent locked Cargo graph shipped as df.dll.
          # These are the three reviewed unmaintained-crate notices in that graph;
          # vulnerability findings remain fatal.
          cargo audit `
            --file build-support/deepfilter/Cargo.lock `
            --deny warnings `
            --ignore RUSTSEC-2024-0436 `
            --ignore RUSTSEC-2024-0370 `
            --ignore RUSTSEC-2026-0319
          if ($LASTEXITCODE -ne 0) { throw "DeepFilter RustSec audit failed with exit code $LASTEXITCODE." }
      - name: Download pinned Silero contract model
        run: |
          $asset = (Get-Content release-assets.json | ConvertFrom-Json).assets |
            Where-Object { $_.path -eq "models/silero_vad.onnx" }
          if (-not $asset -or $asset.source -notmatch "^https://") {
            throw "release-assets.json does not define a direct Silero model source."
          }
          New-Item -ItemType Directory -Force -Path models | Out-Null
          Invoke-WebRequest -Uri $asset.source -OutFile $asset.path
          $actualHash = (Get-FileHash -LiteralPath $asset.path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $asset.sha256) {
            throw "Silero model hash mismatch: $actualHash"
          }
      # The seeded contention stress test runs in the rust-stress job, in
      # release mode; this debug run skips only that one test.
      - name: Rust tests
        run: cargo test --locked -p mic_eq_core -- --skip seeded_control_and_dsp_loops_remain_finite_under_contention --exact
      - name: Clippy
        run: cargo clippy --locked -p mic_eq_core --all-targets -- -D warnings

  # The only run of the seeded control/DSP contention stress test.
  rust-stress:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned 1.94.0
        with:
          toolchain: 1.94.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-rust-stress-v1-py313-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'Cargo.toml', 'rust-core/Cargo.toml') }}
      - name: Hydrate pinned CPU ONNX Runtime
        run: |
          python python/tools/fetch_release_assets.py --only-cpu-runtime --force
          if ($LASTEXITCODE -ne 0) { throw "CPU ONNX Runtime hydration failed with exit code $LASTEXITCODE." }
      - name: Release-mode control/DSP contention stress
        run: cargo test --release --locked -p mic_eq_core --test stress_tests seeded_control_and_dsp_loops_remain_finite_under_contention
