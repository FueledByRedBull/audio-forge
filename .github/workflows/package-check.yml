name: Package check

# Builds the portable bundle and the MSI from the pushed source and smoke-tests
# both with the steps of Release package, so a packaging regression shows up on
# the pull request, not at release dispatch. It publishes and uploads nothing.
# Pull requests run it only when they touch what the bundle is built from.
on:
  push:
    branches: ["master"]
  pull_request:
    paths:
      - AudioForge.spec
      - AudioForge.ico
      - LICENSE
      - build_exe.ps1
      - build_msi.ps1
      - build_deepfilter.ps1
      - launcher.py
      - pyproject.toml
      - release-assets.json
      - requirements/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - rust-core/**
      - build-support/**
      - installer/**
      - pyinstaller-hooks/**
      - licenses/**
      - python/mic_eq/**
      - python/tools/**
      - .github/workflows/package-check.yml

concurrency:
  group: package-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RUSTFLAGS: -C debuginfo=0

defaults:
  run:
    shell: pwsh

jobs:
  package:
    name: Build and smoke-test the bundle and MSI
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16; the toolchain input pins 1.94.0
        with:
          toolchain: 1.94.0

      # Downloaded crate sources only: nothing that is compiled here (target/,
      # df.dll) is restored from a cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-v1-${{ hashFiles('Cargo.lock', 'build-support/deepfilter/Cargo.lock') }}

      - name: Create Python 3.13 virtual environment
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "Python 3.13 virtual environment creation failed." }

      - name: Install Python dependencies
        run: .\.venv\Scripts\python.exe -m pip install --require-hashes -r requirements/dev.txt --no-compile

      - name: Download and verify pinned release runtime assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\.venv\Scripts\python.exe python/tools/fetch_release_assets.py --force
          if ($LASTEXITCODE -ne 0) { throw "Runtime asset hydration failed with exit code $LASTEXITCODE." }

      - name: Configure pinned CPU ONNX Runtime
        run: |
          $ortLib = (Resolve-Path "target\onnxruntime-cpu\lib").Path
          "ORT_LIB_LOCATION=$ortLib" >> $env:GITHUB_ENV
          "ORT_PREFER_DYNAMIC_LINK=1" >> $env:GITHUB_ENV

      - name: Build Rust extension
        run: .\.venv\Scripts\python.exe -m maturin develop --release --locked

      - name: Verify release assets
        run: .\.venv\Scripts\python.exe python/tools/verify_release_assets.py

      - name: Build executable
        run: powershell -ExecutionPolicy Bypass -File .\build_exe.ps1 -PythonPath .\.venv\Scripts\python.exe

      - name: Package smoke
        run: .\.venv\Scripts\python.exe python/tools/package_smoke.py

      # package_smoke.py never launches the executable.
      - name: Hidden executable smoke test
        run: |
          $exe = Resolve-Path ".\dist\AudioForge\AudioForge.exe"
          $process = Start-Process -FilePath $exe `
            -ArgumentList "--smoke-test" `
            -WorkingDirectory (Split-Path -Parent $exe) `
            -WindowStyle Hidden `
            -PassThru
          $process | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
          $process.Refresh()
          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Executable smoke test timed out after 60 seconds."
          }
          if ($process.ExitCode -ne 0) {
            throw "Executable smoke test failed with code $($process.ExitCode)."
          }

      - name: Build per-user MSI from the portable tree and smoke-test it
        run: |
          $version = (.\.venv\Scripts\python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw "Unable to read the project version from pyproject.toml."
          }
          $msiVersion = (.\.venv\Scripts\python.exe python/tools/release_version.py msi $version).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($msiVersion)) {
            throw "Project version '$version' cannot be represented by the MSI version mapping."
          }
          $installer = Join-Path $env:RUNNER_TEMP "AudioForge-package-check.msi"
          $upgradeBaselineRoot = Join-Path $env:RUNNER_TEMP ("AudioForge-msi-upgrade-baseline-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $upgradeBaselineRoot | Out-Null
          Copy-Item -LiteralPath ".\dist\AudioForge" -Destination $upgradeBaselineRoot -Recurse
          $upgradeBaselinePayload = Join-Path $upgradeBaselineRoot "AudioForge"
          $baselineBuildInfo = Join-Path $upgradeBaselinePayload "_internal\audioforge-build.json"
          @{
            schema_version = 1
            version = "0.0.0"
          } | ConvertTo-Json | Set-Content -LiteralPath $baselineBuildInfo -Encoding utf8
          Set-Content -LiteralPath (Join-Path $upgradeBaselinePayload "_internal\msi-upgrade-baseline-only.marker") -Value "baseline" -Encoding utf8
          $upgradeBaseline = Join-Path $env:RUNNER_TEMP "AudioForge-upgrade-baseline.msi"
          # Only the upgrade test installs the baseline, so it is not compressed.
          powershell -ExecutionPolicy Bypass -File .\build_msi.ps1 `
            -Payload $upgradeBaselinePayload `
            -Version 0.0.0 `
            -Output $upgradeBaseline `
            -CompressionLevel none `
            -AcceptWixEula
          if ($LASTEXITCODE -ne 0) {
            throw "MSI upgrade-baseline build failed with exit code $LASTEXITCODE."
          }
          powershell -ExecutionPolicy Bypass -File .\build_msi.ps1 `
            -Payload .\dist\AudioForge `
            -Version $msiVersion `
            -Output $installer `
            -AcceptWixEula
          if ($LASTEXITCODE -ne 0) {
            throw "MSI build failed with exit code $LASTEXITCODE."
          }
          .\.venv\Scripts\python.exe python/tools/msi_smoke.py `
            --msi $installer `
            --payload .\dist\AudioForge `
            --install-uninstall `
            --upgrade-from $upgradeBaseline
          if ($LASTEXITCODE -ne 0) {
            throw "MSI smoke validation failed with exit code $LASTEXITCODE."
          }
