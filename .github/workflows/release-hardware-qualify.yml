name: Qualify release candidate on hardware

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing Git tag, for example v1.10.2."
        required: true
        type: string
      candidate_run_id:
        description: "Successful Release package workflow run containing the exact candidate."
        required: true
        type: string
      expected_archive_sha256:
        description: "SHA-256 of the exact candidate archive to qualify."
        required: true
        type: string
      health_input:
        description: "Physical microphone device name used for the sustained-health run."
        required: true
        type: string
      health_output:
        description: "Selected output device name used for the sustained-health run."
        required: true
        type: string
      correlation_input:
        description: "Loopback/capture input used for selected-route correlation."
        required: true
        type: string
      correlation_output:
        description: "Selected output used for selected-route correlation."
        required: true
        type: string
      health_duration_seconds:
        description: "Sustained-health duration; release qualification requires at least 1800 seconds."
        required: true
        default: "1800"
        type: string
      case_id:
        description: "Portable matrix case ID, for example win11-usb-48k-baseline."
        required: true
        type: string
      device_class:
        description: "Input endpoint class represented by this case."
        required: true
        type: choice
        options:
          - built_in
          - usb
          - virtual
          - other
      nominal_sample_rate_hz:
        description: "Windows endpoint nominal rate for this case."
        required: true
        type: choice
        options:
          - "44100"
          - "48000"
      scenario:
        description: "Lifecycle scenario exercised during the sustained run."
        required: true
        type: choice
        options:
          - baseline
          - device_reconnect
          - default_device_change
          - sleep_resume
          - model_configuration_change
      evidence_kind:
        description: "Physical lifecycle scenarios require an operator-observed event."
        required: true
        type: choice
        options:
          - automated
          - operator_observed
      confirm_scenario_observed:
        description: "Attest that the selected physical lifecycle event was actually performed during the run."
        required: true
        default: false
        type: boolean

concurrency:
  group: release-hardware-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualify-hardware:
    name: Qualify exact candidate on AudioForge hardware
    runs-on: [self-hosted, windows, x64, audioforge-hardware]
    timeout-minutes: 60
    # Repository settings limit this environment to master, which also binds a
    # copy of this file that drops the first step.
    environment: release
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: powershell
    steps:
      - name: Authorize the dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHER: ${{ github.triggering_actor }}
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/master") {
            throw "This workflow runs only from refs/heads/master, not $env:GITHUB_REF."
          }
          $permission = Invoke-RestMethod `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" } `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/collaborators/$([uri]::EscapeDataString($env:DISPATCHER))/permission"
          if ($permission.role_name -notin @("admin", "maintain")) {
            throw "$env:DISPATCHER needs the admin or maintain role to run this workflow, but has '$($permission.role_name)'."
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements/runtime.txt

      - name: Prepare isolated Python 3.13
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "audioforge-hardware-venv"
          if (Test-Path -LiteralPath $venv) {
            Remove-Item -LiteralPath $venv -Recurse -Force
          }
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) {
            throw "The hardware runner requires a working Python 3.13.15 installation."
          }
          $scripts = (Resolve-Path (Join-Path $venv "Scripts")).Path
          $scripts >> $env:GITHUB_PATH
          & (Join-Path $scripts "python.exe") --version
          if ($LASTEXITCODE -ne 0) {
            throw "The isolated hardware-qualification Python failed to start."
          }

      - name: Verify the candidate run
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          if ($env:CANDIDATE_RUN_ID -notmatch '^\d+$') {
            throw "candidate_run_id must contain only decimal digits."
          }
          $run = Invoke-RestMethod `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID"
          $head = (git rev-parse HEAD).Trim()
          if (
            $run.name -ne "Release package" -or
            $run.event -ne "workflow_dispatch" -or
            $run.status -ne "completed" -or
            $run.conclusion -ne "success" -or
            $run.head_sha -ne $head
          ) {
            throw "candidate_run_id must be a successful Release package run of the release tag commit."
          }
          "attempt=$($run.run_attempt)" >> $env:GITHUB_OUTPUT

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audioforge-release-candidate-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/audioforge-release-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Install pinned evaluation runtime
        run: |
          python -m pip install --require-hashes -r requirements/runtime.txt --no-compile

      - name: Extract and verify exact candidate
        id: candidate
        env:
          EXPECTED_SHA256: ${{ inputs.expected_archive_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ steps.producer.outputs.attempt }}
        run: |
          $canonicalTag = (python python/tools/release_version.py tag $env:RELEASE_TAG).Trim()
          if ($LASTEXITCODE -ne 0 -or $canonicalTag -ne $env:RELEASE_TAG) {
            throw "release_tag must be the canonical vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N tag."
          }
          if ($env:EXPECTED_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
            throw "expected_archive_sha256 must contain exactly 64 hexadecimal characters."
          }
          $candidate = Join-Path $env:RUNNER_TEMP "audioforge-release-candidate"
          $archive = Get-ChildItem -LiteralPath $candidate -Filter "*-win64-ultra.7z" -File
          $checksum = Get-ChildItem -LiteralPath $candidate -Filter "*-win64-ultra.7z.sha256" -File
          $manifest = Get-ChildItem -LiteralPath $candidate -Filter "*-win64-ultra.7z.manifest.json" -File
          $metadata = Get-ChildItem -LiteralPath $candidate -Filter "*-win64-ultra.7z.metadata.json" -File
          $nativeAttestation = Get-ChildItem -LiteralPath $candidate -Filter "*-deepfilter.provenance.json" -File
          if (
            @($archive).Count -ne 1 -or
            @($checksum).Count -ne 1 -or
            @($manifest).Count -ne 1 -or
            @($metadata).Count -ne 1 -or
            @($nativeAttestation).Count -ne 1
          ) {
            throw "Candidate artifact must contain exactly one archive, DeepFilter attestation, and each provenance sidecar."
          }

          $extract = Join-Path $env:RUNNER_TEMP "audioforge-hardware-candidate"
          if (Test-Path -LiteralPath $extract) {
            Remove-Item -LiteralPath $extract -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip/7z.exe"
          & $sevenZip x -y "-o$extract" $archive.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Candidate extraction failed with exit code $LASTEXITCODE."
          }

          $tagCommit = git rev-list -n 1 $env:RELEASE_TAG --
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagCommit)) {
            throw "Unable to resolve release tag '$env:RELEASE_TAG'."
          }
          if ((git rev-parse HEAD).Trim() -ne $tagCommit.Trim()) {
            throw "The checkout is not the release tag commit."
          }

          python python/tools/release_provenance.py verify `
            --bundle $extract `
            --archive $archive.FullName `
            --checksum $checksum.FullName `
            --manifest $manifest.FullName `
            --metadata $metadata.FullName `
            --baseline evaluation/release-bundle-path-baseline.json `
            --expected-archive-sha256 ($env:EXPECTED_SHA256).ToLowerInvariant() `
            --expected-commit $tagCommit.Trim() `
            --expected-producer "Release package" $env:CANDIDATE_RUN_ID $env:CANDIDATE_RUN_ATTEMPT `
            --require-source-distribution `
            --native-attestation $nativeAttestation.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Exact-candidate provenance verification failed."
          }

          "archive=$($archive.FullName)" >> $env:GITHUB_OUTPUT
          "checksum=$($checksum.FullName)" >> $env:GITHUB_OUTPUT
          "bundle=$extract" >> $env:GITHUB_OUTPUT
          "vad_model=$(Join-Path $extract '_internal/models/silero_vad.onnx')" >> $env:GITHUB_OUTPUT

      - name: Run exact-artifact hardware qualification
        env:
          EXPECTED_SHA256: ${{ inputs.expected_archive_sha256 }}
          PYTHONPATH: ${{ github.workspace }}/python
          VAD_MODEL_PATH: ${{ steps.candidate.outputs.vad_model }}
          HEALTH_INPUT: ${{ inputs.health_input }}
          HEALTH_OUTPUT: ${{ inputs.health_output }}
          CORRELATION_INPUT: ${{ inputs.correlation_input }}
          CORRELATION_OUTPUT: ${{ inputs.correlation_output }}
          HEALTH_DURATION: ${{ inputs.health_duration_seconds }}
          BUNDLE: ${{ steps.candidate.outputs.bundle }}
          ARCHIVE: ${{ steps.candidate.outputs.archive }}
          CHECKSUM: ${{ steps.candidate.outputs.checksum }}
          CASE_ID: ${{ inputs.case_id }}
          DEVICE_CLASS: ${{ inputs.device_class }}
          NOMINAL_SAMPLE_RATE_HZ: ${{ inputs.nominal_sample_rate_hz }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SCENARIO: ${{ inputs.scenario }}
          EVIDENCE_KIND: ${{ inputs.evidence_kind }}
          CONFIRM_SCENARIO_OBSERVED: ${{ inputs.confirm_scenario_observed }}
        run: |
          $duration = [double]0
          if (
            -not [double]::TryParse(
              $env:HEALTH_DURATION,
              [Globalization.NumberStyles]::Float,
              [Globalization.CultureInfo]::InvariantCulture,
              [ref]$duration
            ) -or
            $duration -lt 1800
          ) {
            throw "Release hardware qualification requires at least 1800 seconds."
          }
          $scenarioConfirmation = @()
          $report = Join-Path $env:RUNNER_TEMP "release-hardware-qualification.json"
          if ($env:SCENARIO -in @("device_reconnect", "default_device_change", "sleep_resume")) {
            if (
              $env:EVIDENCE_KIND -ne "operator_observed" -or
              $env:CONFIRM_SCENARIO_OBSERVED -ne "true"
            ) {
              throw "Physical lifecycle qualification requires explicit operator attestation."
            }
            $scenarioConfirmation = @("--confirm-scenario-observed")
          }
          python python/tools/evaluate_hardware_validation.py `
            --health-input $env:HEALTH_INPUT `
            --health-output $env:HEALTH_OUTPUT `
            --correlation-input $env:CORRELATION_INPUT `
            --correlation-output $env:CORRELATION_OUTPUT `
            --health-duration $duration `
            --bundle-root $env:BUNDLE `
            --archive $env:ARCHIVE `
            --checksum $env:CHECKSUM `
            --expected-archive-sha256 ($env:EXPECTED_SHA256).ToLowerInvariant() `
            --case-id $env:CASE_ID `
            --device-class $env:DEVICE_CLASS `
            --nominal-sample-rate-hz $env:NOMINAL_SAMPLE_RATE_HZ `
            --scenario $env:SCENARIO `
            --evidence-kind $env:EVIDENCE_KIND `
            @scenarioConfirmation `
            --report $report
          if ($LASTEXITCODE -ne 0) {
            throw "Exact-artifact hardware qualification failed."
          }
          $reportObject = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          $producerHeadSha = (git rev-list -n 1 $env:RELEASE_TAG --).Trim()
          if ($LASTEXITCODE -ne 0 -or $producerHeadSha -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Unable to resolve the release tag commit for qualification provenance."
          }
          $reportObject | Add-Member -NotePropertyName producer -NotePropertyValue ([ordered]@{
            repository = $env:GITHUB_REPOSITORY
            workflow = $env:GITHUB_WORKFLOW
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            event = $env:GITHUB_EVENT_NAME
            head_sha = $producerHeadSha
            ref = $env:GITHUB_REF
          }) -Force
          $reportObject | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $report -Encoding utf8

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: audioforge-release-hardware-validation-${{ inputs.release_tag }}-${{ inputs.case_id }}
          path: ${{ runner.temp }}/release-hardware-qualification.json
          if-no-files-found: error
          retention-days: 14
