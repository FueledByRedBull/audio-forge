name: Release package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag / GitHub Release to publish to. Defaults to v<pyproject version>."
        required: false
        type: string
      asset_source_tag:
        description: "Published release used only as a fallback for pinned runtime assets. Defaults to v1.8.0."
        required: false
        type: string
      upload_to_release:
        description: "Upload the generated archive and checksum to the GitHub Release."
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

concurrency:
  group: release-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-windows:
    name: Build Windows release package
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      archive: ${{ steps.package.outputs.archive }}
      checksum: ${{ steps.package.outputs.checksum }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version: ${{ steps.meta.outputs.version }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      RUSTFLAGS: -C debuginfo=0
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-release-

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: .\.venv\Scripts\python.exe -m pip install --require-hashes -r requirements/dev.txt

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_ASSET_SOURCE_TAG: ${{ inputs.asset_source_tag }}
          CONFIGURED_ASSET_SOURCE_TAG: ${{ vars.AUDIOFORGE_ASSET_SOURCE_TAG }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = .\.venv\Scripts\python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $expectedTag = "v$version"
          $releaseTag = $env:INPUT_RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            if ($env:REF_TYPE -eq "tag") {
              $releaseTag = $env:REF_NAME
            } else {
              $releaseTag = $expectedTag
            }
          }
          if ($releaseTag -ne $expectedTag) {
            throw "Release tag '$releaseTag' does not match pyproject version '$version' ($expectedTag)."
          }

          $assetSourceTag = $env:INPUT_ASSET_SOURCE_TAG
          if ([string]::IsNullOrWhiteSpace($assetSourceTag)) {
            $assetSourceTag = $env:CONFIGURED_ASSET_SOURCE_TAG
          }
          if ([string]::IsNullOrWhiteSpace($assetSourceTag)) {
            $assetSourceTag = "v1.8.0"
          }

          $archive = "AudioForge-v$version-win64-ultra.7z"
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "asset_source_tag=$assetSourceTag" >> $env:GITHUB_OUTPUT
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Download and verify pinned release runtime assets
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_SOURCE_TAG: ${{ steps.meta.outputs.asset_source_tag }}
        run: |
          .\.venv\Scripts\python.exe python/tools/fetch_release_assets.py `
            --release-tag $env:ASSET_SOURCE_TAG `
            --force

      - name: Build Rust extension
        run: .\.venv\Scripts\python.exe -m maturin develop --release

      - name: Audit locked Python dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip_audit --require-hashes -r requirements/runtime.txt
          # Semgrep 1.171.0 currently pins mcp==1.23.3 for its optional
          # `semgrep mcp` server. This repository only invokes `semgrep scan`;
          # keep the upstream IDs explicit until Semgrep publishes a compatible
          # MCP pin rather than hiding unrelated audit results.
          .\.venv\Scripts\python.exe -m pip_audit --require-hashes -r requirements/dev.txt `
            --ignore-vuln PYSEC-2026-3481 `
            --ignore-vuln PYSEC-2026-3482 `
            --ignore-vuln PYSEC-2026-3483

      - name: Python release gates
        run: |
          .\.venv\Scripts\python.exe -m ruff check python/mic_eq python/tests python/tools
          .\.venv\Scripts\python.exe -m pyright
          .\.venv\Scripts\python.exe -m pytest python/tests -q
          .\.venv\Scripts\python.exe python/tools/check_versions.py
          .\.venv\Scripts\python.exe python/tools/check_workflows.py
          .\.venv\Scripts\python.exe python/tools/package_smoke.py --source-only

      - name: Semgrep
        run: .\.venv\Scripts\python.exe python/tools/run_semgrep.py --sarif release-semgrep-results.sarif

      - name: Upload release Semgrep SARIF
        if: always() && hashFiles('release-semgrep-results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-semgrep-sarif-${{ github.run_id }}
          path: release-semgrep-results.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Rust format
        run: cargo fmt --check

      - name: RustSec audit
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # master, Node 24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust tests and lint
        run: |
          cargo test -p mic_eq_core
          cargo test --release -p mic_eq_core --test stress_tests seeded_control_and_dsp_loops_remain_finite_under_contention
          cargo clippy -p mic_eq_core --all-targets -- -D warnings

      - name: Verify release assets
        run: .\.venv\Scripts\python.exe python/tools/verify_release_assets.py

      - name: Build executable
        run: powershell -ExecutionPolicy Bypass -File .\build_exe.ps1

      - name: Package smoke
        run: .\.venv\Scripts\python.exe python/tools/package_smoke.py

      - name: Create release archive
        id: package
        run: |
          $archive = "${{ steps.meta.outputs.archive }}"
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip/7z.exe"
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            $sevenZip = "7z.exe"
          }
          if (Test-Path -LiteralPath $archive) {
            Remove-Item -LiteralPath $archive -Force
          }
          & $sevenZip a -t7z -mx=9 -m0=lzma2 -mmt=on -ms=on $archive .\dist\AudioForge\*
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip failed with exit code $LASTEXITCODE."
          }

          $checksum = "$archive.sha256"
          $hash = Get-FileHash $archive -Algorithm SHA256
          "$($hash.Hash)  $archive" | Set-Content -Path $checksum -Encoding ascii
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.archive }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release assets
    needs: package-windows
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upload_to_release == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package-windows.outputs.archive }}
          path: release-artifacts
      - name: Upload package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package-windows.outputs.release_tag }}
          VERSION: ${{ needs.package-windows.outputs.version }}
          ARCHIVE: release-artifacts/${{ needs.package-windows.outputs.archive }}
          CHECKSUM: release-artifacts/${{ needs.package-windows.outputs.checksum }}
        run: |
          $notesFile = "release-notes/release-notes-v$env:VERSION.md"
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path -LiteralPath $notesFile) {
              gh release create $env:RELEASE_TAG `
                --repo $env:GITHUB_REPOSITORY `
                --verify-tag `
                --title "AudioForge $env:VERSION" `
                --notes-file $notesFile
            } else {
              gh release create $env:RELEASE_TAG `
                --repo $env:GITHUB_REPOSITORY `
                --verify-tag `
                --title "AudioForge $env:VERSION" `
                --notes "Automated AudioForge Windows release package."
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub Release '$env:RELEASE_TAG'."
            }
          }

          gh release upload $env:RELEASE_TAG $env:ARCHIVE $env:CHECKSUM `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
