name: Release package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing tag to rebuild. Leave blank to validate the selected branch before tagging."
        required: false
        type: string
      asset_source_tag:
        description: "Published release used only as a fallback for pinned runtime assets. Defaults to release-assets.json."
        required: false
        type: string

concurrency:
  group: release-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RUSTFLAGS: -C debuginfo=0

defaults:
  run:
    shell: pwsh

# Gates that need no built file run in `static`, beside `package-windows`. The
# Python and Rust tests start once `package-windows` has finished and run on the
# runtime files it produced (the audioforge-release-runtime artifact of this
# run, never the Actions cache), so they test what the candidate contains.
# `validate-candidate` needs only `package-windows`. Promotion requires the
# whole run to succeed: keep every job unconditional and blocking.
jobs:
  static:
    name: Static checks and audits
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Version check
        run: python python/tools/check_versions.py

      - name: Evaluation evidence hygiene
        run: python python/tools/check_evaluation_hygiene.py

      - name: Install Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt --no-compile
          if ($LASTEXITCODE -ne 0) { throw "Dependency install failed with exit code $LASTEXITCODE." }

      - name: Audit locked Python dependencies
        run: |
          python -m pip_audit --require-hashes -r requirements/runtime.txt --disable-pip
          if ($LASTEXITCODE -ne 0) { throw "Runtime dependency audit failed with exit code $LASTEXITCODE." }
          # semgrep pins mcp==1.29.0 exactly, so the dev lock cannot move off
          # CVE-2026-59951. Only semgrep's MCP server uses mcp and nothing here
          # runs it. Remove the ignore when semgrep allows mcp>=1.30.0.
          python -m pip_audit --require-hashes -r requirements/dev.txt --disable-pip --ignore-vuln CVE-2026-59951
          if ($LASTEXITCODE -ne 0) { throw "Development dependency audit failed with exit code $LASTEXITCODE." }

      - name: Ruff
        run: python -m ruff check python/mic_eq python/tests python/tools

      # Reads mic_eq_core.pyi; the built extension is not needed.
      - name: Pyright
        run: python -m pyright

      - name: Workflow definition check
        run: python python/tools/check_workflows.py

      - name: Package source smoke
        run: python python/tools/package_smoke.py --source-only

      - name: Semgrep
        run: python python/tools/run_semgrep.py --sarif release-semgrep-results.sarif

      - name: Upload release Semgrep SARIF
        if: always() && hashFiles('release-semgrep-results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-semgrep-sarif-${{ github.run_id }}
          path: release-semgrep-results.sarif
          if-no-files-found: error
          retention-days: 14

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned 1.94.0
        with:
          toolchain: 1.94.0

      - name: Rust format
        run: cargo fmt --check

      - name: Cache pinned cargo-audit and advisory database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-audit.exe
            ~/.cargo/advisory-db
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-audit-0.22.2
      - name: Install pinned cargo-audit
        run: |
          $audit = Join-Path $env:USERPROFILE ".cargo/bin/cargo-audit.exe"
          $version = ""
          if (Test-Path -LiteralPath $audit) { $version = & $audit --version | Out-String }
          if ($version -notmatch "0\.22\.2") {
            cargo install cargo-audit --version 0.22.2 --locked --force
            if ($LASTEXITCODE -ne 0) { throw "cargo-audit installation failed with exit code $LASTEXITCODE." }
          }
          $version = & $audit --version | Out-String
          if ($LASTEXITCODE -ne 0 -or $version -notmatch "0\.22\.2") { throw "cargo-audit 0.22.2 is not available." }
      - name: RustSec audit
        run: |
          cargo audit --deny warnings
          if ($LASTEXITCODE -ne 0) { throw "RustSec audit failed with exit code $LASTEXITCODE." }
          # DeepFilter is an independent locked Cargo graph shipped as df.dll.
          # These are the three reviewed unmaintained-crate notices in that graph;
          # vulnerability findings remain fatal.
          cargo audit `
            --file build-support/deepfilter/Cargo.lock `
            --deny warnings `
            --ignore RUSTSEC-2024-0436 `
            --ignore RUSTSEC-2024-0370 `
            --ignore RUSTSEC-2026-0319
          if ($LASTEXITCODE -ne 0) { throw "DeepFilter RustSec audit failed with exit code $LASTEXITCODE." }

  package-windows:
    name: Build Windows release package
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      archive: ${{ steps.package.outputs.archive }}
      installer: ${{ steps.package.outputs.installer }}
      checksum: ${{ steps.provenance.outputs.checksum }}
      manifest: ${{ steps.provenance.outputs.manifest }}
      metadata: ${{ steps.provenance.outputs.metadata }}
      installer_checksum: ${{ steps.provenance.outputs.installer_checksum }}
      installer_manifest: ${{ steps.provenance.outputs.installer_manifest }}
      installer_metadata: ${{ steps.provenance.outputs.installer_metadata }}
      source_archive: ${{ steps.source.outputs.archive }}
      source_checksum: ${{ steps.source.outputs.checksum }}
      source_metadata: ${{ steps.source.outputs.metadata }}
      native_attestation: ${{ steps.native.outputs.attestation }}
      native_sha256: ${{ steps.runtime.outputs.native_sha256 }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      source_revision: ${{ steps.meta.outputs.source_revision }}
      version: ${{ steps.meta.outputs.version }}
      msi_version: ${{ steps.meta.outputs.msi_version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    env:
      AUDIOFORGE_SOURCE_DIR: build/source-distribution
    steps:
      # The dispatch commit, not the moving branch tip, so every job of this
      # run works on the same source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Bind source revision to checked-out release ref
        run: |
          $sourceRevision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceRevision -notmatch '^[0-9a-f]{40}$') {
            throw "Checked-out source revision is not a full commit: $sourceRevision"
          }
          "AUDIOFORGE_SOURCE_REVISION=$sourceRevision" >> $env:GITHUB_ENV

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned 1.94.0
        with:
          toolchain: 1.94.0

      # Downloaded crate sources only: cargo checks them against the lockfiles.
      # Nothing that is compiled here (target/, df.dll) is restored from a cache,
      # because this job builds the binaries the candidate ships.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-v1-${{ hashFiles('Cargo.lock', 'build-support/deepfilter/Cargo.lock') }}

      - name: Create Python 3.13 virtual environment
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "Python 3.13 virtual environment creation failed." }

      - name: Install Python dependencies
        run: .\.venv\Scripts\python.exe -m pip install --require-hashes -r requirements/dev.txt --no-compile

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_ASSET_SOURCE_TAG: ${{ inputs.asset_source_tag }}
          CONFIGURED_ASSET_SOURCE_TAG: ${{ vars.AUDIOFORGE_ASSET_SOURCE_TAG }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (.\.venv\Scripts\python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw "Unable to read the project version from pyproject.toml."
          }
          $expectedTag = (.\.venv\Scripts\python.exe python/tools/release_version.py tag $version).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($expectedTag)) {
            throw "Project version '$version' is not a supported final or RC release version."
          }
          $releaseTag = $env:INPUT_RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            if ($env:REF_TYPE -eq "tag") {
              $releaseTag = $env:REF_NAME
            } else {
              $releaseTag = $expectedTag
            }
          }
          if ($releaseTag -ne $expectedTag) {
            throw "Release tag '$releaseTag' does not match pyproject version '$version' ($expectedTag)."
          }

          $msiVersion = (.\.venv\Scripts\python.exe python/tools/release_version.py msi $version).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($msiVersion)) {
            throw "Project version '$version' cannot be represented by the MSI version mapping."
          }
          $isPrerelease = (.\.venv\Scripts\python.exe python/tools/release_version.py prerelease $version).Trim()
          if ($LASTEXITCODE -ne 0 -or $isPrerelease -notin @("true", "false")) {
            throw "Unable to classify project version '$version' as a release or prerelease."
          }

          $assetSourceTag = $env:INPUT_ASSET_SOURCE_TAG
          if ([string]::IsNullOrWhiteSpace($assetSourceTag)) {
            $assetSourceTag = $env:CONFIGURED_ASSET_SOURCE_TAG
          }
          if ([string]::IsNullOrWhiteSpace($assetSourceTag)) {
            $assetSourceTag = (
              Get-Content -LiteralPath "release-assets.json" -Raw |
                ConvertFrom-Json
            ).fallback_release_tag
          }
          if ([string]::IsNullOrWhiteSpace($assetSourceTag)) {
            throw "release-assets.json does not define fallback_release_tag."
          }

          $archive = "AudioForge-$expectedTag-win64-ultra.7z"
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "source_revision=$env:AUDIOFORGE_SOURCE_REVISION" >> $env:GITHUB_OUTPUT
          "msi_version=$msiVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT
          "asset_source_tag=$assetSourceTag" >> $env:GITHUB_OUTPUT
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Bind existing release tag to checked-out commit
        if: inputs.release_tag != '' || github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          $currentCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $currentCommit -notmatch '^[0-9a-f]{40}$') {
            throw "Checked-out source revision is not a full commit: $currentCommit"
          }
          $tagRef = "refs/tags/$($env:RELEASE_TAG)"
          $tagFetchSpec = "$tagRef`:$tagRef"
          git fetch --no-tags origin $tagFetchSpec
          if ($LASTEXITCODE -ne 0) {
            throw "Existing release tag '$env:RELEASE_TAG' could not be fetched from origin."
          }
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG --).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -notmatch '^[0-9a-f]{40}$') {
            throw "Existing release tag '$env:RELEASE_TAG' does not resolve to a full commit: $tagCommit"
          }
          if ($tagCommit -ne $currentCommit) {
            throw "Existing release tag '$env:RELEASE_TAG' must resolve to the checked-out commit $currentCommit, but resolves to $tagCommit."
          }

      - name: Download and verify pinned release runtime assets
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_SOURCE_TAG: ${{ steps.meta.outputs.asset_source_tag }}
        run: |
          .\.venv\Scripts\python.exe python/tools/fetch_release_assets.py `
            --release-tag $env:ASSET_SOURCE_TAG `
            --force

      - name: Configure pinned CPU ONNX Runtime
        run: |
          $ortLib = (Resolve-Path "target\onnxruntime-cpu\lib").Path
          "ORT_LIB_LOCATION=$ortLib" >> $env:GITHUB_ENV
          "ORT_PREFER_DYNAMIC_LINK=1" >> $env:GITHUB_ENV

      - name: Build Rust extension
        run: .\.venv\Scripts\python.exe -m maturin develop --release --locked

      - name: Verify release assets
        run: .\.venv\Scripts\python.exe python/tools/verify_release_assets.py

      # The archives depend only on the manifest entries; the manifest file also
      # carries project_version, which changes every release. source_distribution.py
      # re-hashes each restored archive against the manifest and rejects extras.
      - name: Digest the pinned dependency source entries
        id: source_entries
        run: |
          $digest = (.\.venv\Scripts\python.exe -c "import hashlib, json; m = json.load(open('licenses/source-manifest.json', encoding='utf-8')); print(hashlib.sha256(json.dumps(m['entries'], sort_keys=True, separators=(',', ':')).encode()).hexdigest())").Trim()
          if ($LASTEXITCODE -ne 0 -or $digest -notmatch '^[0-9a-f]{64}$') {
            throw "Unable to digest the source manifest entries."
          }
          "digest=$digest" >> $env:GITHUB_OUTPUT

      - name: Cache pinned dependency source archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/source-distribution/archives
          key: corresponding-source-content-v2-${{ steps.source_entries.outputs.digest }}

      - name: Hydrate and verify corresponding source
        id: source
        run: |
          $sourceDir = $env:AUDIOFORGE_SOURCE_DIR
          .\.venv\Scripts\python.exe python/tools/source_distribution.py bundle `
            --manifest licenses/source-manifest.json `
            --output $sourceDir `
            --revision $env:AUDIOFORGE_SOURCE_REVISION `
            --include-runtime-assets
          if ($LASTEXITCODE -ne 0) {
            throw "Corresponding-source hydration failed with exit code $LASTEXITCODE."
          }
          .\.venv\Scripts\python.exe python/tools/source_distribution.py verify `
            --manifest licenses/source-manifest.json `
            --source-dir $sourceDir `
            --include-runtime-assets `
            --require-receipt `
            --revision $env:AUDIOFORGE_SOURCE_REVISION
          if ($LASTEXITCODE -ne 0) {
            throw "Corresponding-source verification failed with exit code $LASTEXITCODE."
          }
          $receiptPath = Join-Path $sourceDir "source-receipt.json"
          $projectSource = Join-Path $sourceDir "AudioForge-project-source.tar"
          if (-not (Test-Path -LiteralPath $receiptPath -PathType Leaf) -or
              -not (Test-Path -LiteralPath $projectSource -PathType Leaf)) {
            throw "Hydrated source is missing its receipt or tracked project archive."
          }
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip/7z.exe"
          if (-not (Test-Path -LiteralPath $sevenZip)) { $sevenZip = "7z.exe" }
          $sourceArchive = "AudioForge-${{ steps.meta.outputs.release_tag }}-source.7z"
          if (Test-Path -LiteralPath $sourceArchive) {
            Remove-Item -LiteralPath $sourceArchive -Force
          }
          & $sevenZip a -t7z -mx=9 -m0=lzma2 -mmt=on -ms=on $sourceArchive (Join-Path (Resolve-Path $sourceDir).Path "*")
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip source archive failed with exit code $LASTEXITCODE."
          }
          $sourceHash = (Get-FileHash -LiteralPath $sourceArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceChecksum = "$sourceArchive.sha256"
          "$sourceHash  $sourceArchive" | Set-Content -LiteralPath $sourceChecksum -Encoding ascii
          $receiptHash = (Get-FileHash -LiteralPath $receiptPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestHash = (Get-FileHash -LiteralPath "licenses/source-manifest.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          $projectSourceHash = (Get-FileHash -LiteralPath $projectSource -Algorithm SHA256).Hash.ToLowerInvariant()
          $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          if ([string]$receipt.revision -ne $env:AUDIOFORGE_SOURCE_REVISION) {
            throw "Source receipt revision does not match the workflow commit."
          }
          $sourceMetadata = "$sourceArchive.metadata.json"
          @{
            schema_version = 1
            project = "AudioForge"
            version = "${{ steps.meta.outputs.version }}"
            commit = $env:AUDIOFORGE_SOURCE_REVISION
            archive = @{
              name = $sourceArchive
              size = (Get-Item -LiteralPath $sourceArchive).Length
              sha256 = $sourceHash
              checksum = [IO.Path]::GetFileName($sourceChecksum)
            }
            source_manifest_sha256 = $manifestHash
            source_receipt_sha256 = $receiptHash
            project_source_sha256 = $projectSourceHash
            project_source_name = [IO.Path]::GetFileName($projectSource)
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $sourceMetadata -Encoding utf8
          "archive=$sourceArchive" >> $env:GITHUB_OUTPUT
          "checksum=$sourceChecksum" >> $env:GITHUB_OUTPUT
          "metadata=$sourceMetadata" >> $env:GITHUB_OUTPUT

      - name: Build executable
        run: powershell -ExecutionPolicy Bypass -File .\build_exe.ps1 -PythonPath .\.venv\Scripts\python.exe

      - name: Package smoke
        run: .\.venv\Scripts\python.exe python/tools/package_smoke.py

      - name: Bind DeepFilter build attestation to the packaged DLL
        id: native
        run: |
          $attestationSource = Resolve-Path "target/deepfilter/df.dll.provenance.json"
          $attestation = "AudioForge-${{ steps.meta.outputs.release_tag }}-deepfilter.provenance.json"
          Copy-Item -LiteralPath $attestationSource -Destination $attestation -Force
          $attestationObject = Get-Content -LiteralPath $attestation -Raw | ConvertFrom-Json
          $dll = Resolve-Path "df.dll"
          $dllHash = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if ([string]$attestationObject.output.name -notmatch '^[^\\/:*?"<>|]+\.dll$' -or
              [string]$attestationObject.output.sha256 -ne $dllHash -or
              [int64]$attestationObject.output.bytes -ne (Get-Item -LiteralPath $dll).Length) {
            throw "DeepFilter attestation does not match the source-built runtime DLL."
          }
          .\.venv\Scripts\python.exe python/tools/verify_release_assets.py
          if ($LASTEXITCODE -ne 0) {
            throw "DeepFilter source-build attestation validation failed."
          }
          "attestation=$attestation" >> $env:GITHUB_OUTPUT

      - name: Build per-user MSI from exact portable tree
        id: installer
        run: |
          $installer = "AudioForge-${{ steps.meta.outputs.release_tag }}-win64.msi"
          $upgradeBaselineRoot = Join-Path $env:RUNNER_TEMP ("AudioForge-msi-upgrade-baseline-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $upgradeBaselineRoot | Out-Null
          Copy-Item -LiteralPath ".\dist\AudioForge" -Destination $upgradeBaselineRoot -Recurse
          $upgradeBaselinePayload = Join-Path $upgradeBaselineRoot "AudioForge"
          $baselineBuildInfo = Join-Path $upgradeBaselinePayload "_internal\audioforge-build.json"
          @{
            schema_version = 1
            version = "0.0.0"
          } | ConvertTo-Json | Set-Content -LiteralPath $baselineBuildInfo -Encoding utf8
          Set-Content -LiteralPath (Join-Path $upgradeBaselinePayload "_internal\msi-upgrade-baseline-only.marker") -Value "baseline" -Encoding utf8
          $upgradeBaseline = Join-Path $env:RUNNER_TEMP "AudioForge-upgrade-baseline.msi"
          powershell -ExecutionPolicy Bypass -File .\build_msi.ps1 `
            -Payload $upgradeBaselinePayload `
            -Version 0.0.0 `
            -Output $upgradeBaseline
          if ($LASTEXITCODE -ne 0) {
            throw "MSI upgrade-baseline build failed with exit code $LASTEXITCODE."
          }
          powershell -ExecutionPolicy Bypass -File .\build_msi.ps1 `
            -Payload .\dist\AudioForge `
            -Version "${{ steps.meta.outputs.msi_version }}" `
            -Output $installer
          if ($LASTEXITCODE -ne 0) {
            throw "MSI build failed with exit code $LASTEXITCODE."
          }
          .\.venv\Scripts\python.exe python/tools/msi_smoke.py `
            --msi $installer `
            --payload .\dist\AudioForge `
            --install-uninstall `
            --upgrade-from $upgradeBaseline
          if ($LASTEXITCODE -ne 0) {
            throw "MSI smoke validation failed with exit code $LASTEXITCODE."
          }
          "installer=$installer" >> $env:GITHUB_OUTPUT

      - name: Create release archive
        id: package
        run: |
          $archive = "${{ steps.meta.outputs.archive }}"
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip/7z.exe"
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            $sevenZip = "7z.exe"
          }
          if (Test-Path -LiteralPath $archive) {
            Remove-Item -LiteralPath $archive -Force
          }
          & $sevenZip a -t7z -mx=9 -m0=lzma2 -mmt=on -ms=on $archive .\dist\AudioForge\*
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip failed with exit code $LASTEXITCODE."
          }

          "archive=$archive" >> $env:GITHUB_OUTPUT
          "installer=${{ steps.installer.outputs.installer }}" >> $env:GITHUB_OUTPUT

      - name: Generate exact-artifact provenance
        id: provenance
        run: |
          $archive = "${{ steps.package.outputs.archive }}"
          .\.venv\Scripts\python.exe python/tools/release_provenance.py create `
            --bundle dist/AudioForge `
            --archive $archive `
            --baseline evaluation/release-bundle-path-baseline.json `
            --native-attestation ${{ steps.native.outputs.attestation }} `
            --output-dir .
          if ($LASTEXITCODE -ne 0) {
            throw "Release provenance generation failed."
          }
          $installer = "${{ steps.installer.outputs.installer }}"
          .\.venv\Scripts\python.exe python/tools/release_provenance.py create `
            --bundle dist/AudioForge `
            --archive $installer `
            --baseline evaluation/release-bundle-path-baseline.json `
            --native-attestation ${{ steps.native.outputs.attestation }} `
            --output-dir .
          if ($LASTEXITCODE -ne 0) {
            throw "Installer provenance generation failed."
          }
          "checksum=$archive.sha256" >> $env:GITHUB_OUTPUT
          "manifest=$archive.manifest.json" >> $env:GITHUB_OUTPUT
          "metadata=$archive.metadata.json" >> $env:GITHUB_OUTPUT
          "installer_checksum=$installer.sha256" >> $env:GITHUB_OUTPUT
          "installer_manifest=$installer.manifest.json" >> $env:GITHUB_OUTPUT
          "installer_metadata=$installer.metadata.json" >> $env:GITHUB_OUTPUT

      - name: Report package size changes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_MANIFEST: ${{ steps.provenance.outputs.manifest }}
        run: |
          $previousJson = gh release view --repo $env:GITHUB_REPOSITORY --json tagName,assets
          if ($LASTEXITCODE -ne 0) { throw "Could not read the preceding release for size comparison." }
          $previous = $previousJson | ConvertFrom-Json
          $manifestName = "AudioForge-$($previous.tagName)-win64-ultra.7z.manifest.json"
          $comparisonDir = Join-Path $env:RUNNER_TEMP "bundle-size-comparison"
          New-Item -ItemType Directory -Force -Path $comparisonDir | Out-Null
          $assetNames = @($previous.assets | ForEach-Object { $_.name })
          if ($assetNames -contains $manifestName) {
            gh release download $previous.tagName --repo $env:GITHUB_REPOSITORY --pattern $manifestName --dir $comparisonDir
            if ($LASTEXITCODE -ne 0) { throw "Could not download the preceding payload manifest." }
          } else {
            $evidenceName = "AudioForge-$($previous.tagName)-evidence.7z"
            if ($assetNames -notcontains $evidenceName) {
              "Size comparison unavailable: $($previous.tagName) has no retained payload manifest." >> $env:GITHUB_STEP_SUMMARY
              exit 0
            }
            gh release download $previous.tagName --repo $env:GITHUB_REPOSITORY --pattern $evidenceName --dir $comparisonDir
            if ($LASTEXITCODE -ne 0) { throw "Could not download the preceding release evidence." }
            $sevenZip = Join-Path $env:ProgramFiles "7-Zip/7z.exe"
            & $sevenZip e (Join-Path $comparisonDir $evidenceName) $manifestName "-o$comparisonDir" -y
            if ($LASTEXITCODE -ne 0) { throw "Could not read the preceding payload manifest." }
          }
          "Comparing payload with published $($previous.tagName)." >> $env:GITHUB_STEP_SUMMARY
          .\.venv\Scripts\python.exe python/tools/release_provenance.py compare-sizes `
            --manifest $env:CURRENT_MANIFEST `
            --previous-manifest (Join-Path $comparisonDir $manifestName) >> $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { throw "Package size comparison failed." }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audioforge-release-candidate-${{ steps.meta.outputs.release_tag }}
          compression-level: 0
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.installer }}
            ${{ steps.provenance.outputs.checksum }}
            ${{ steps.provenance.outputs.manifest }}
            ${{ steps.provenance.outputs.metadata }}
            ${{ steps.provenance.outputs.installer_checksum }}
            ${{ steps.provenance.outputs.installer_manifest }}
            ${{ steps.provenance.outputs.installer_metadata }}
            ${{ steps.source.outputs.archive }}
            ${{ steps.source.outputs.checksum }}
            ${{ steps.source.outputs.metadata }}
            ${{ steps.native.outputs.attestation }}
          if-no-files-found: error
          retention-days: 3

      # The Python and Rust test jobs run on these files, not on a second build.
      # The module is copied from the bundle over the build output, so the
      # tested bytes are the packaged bytes; validate-candidate compares them
      # with the module inside the archive it extracts.
      - name: Stage the packaged native module for the test jobs
        id: runtime
        run: |
          $packaged = @(Get-ChildItem -LiteralPath "dist/AudioForge/_internal/mic_eq" -Filter "mic_eq_core*.pyd" -File)
          if ($packaged.Count -ne 1) {
            throw "Expected exactly one packaged native module, found $($packaged.Count)."
          }
          Copy-Item -LiteralPath $packaged[0].FullName -Destination (Join-Path "python/mic_eq" $packaged[0].Name) -Force
          $hash = (Get-FileHash -LiteralPath $packaged[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "native_sha256=$hash" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audioforge-release-runtime
          compression-level: 0
          path: |
            df.dll
            target/deepfilter/df.dll.provenance.json
            target/onnxruntime-cpu/lib/onnxruntime.dll
            target/onnxruntime-cpu/lib/onnxruntime.lib
            target/onnxruntime-cpu/lib/onnxruntime_providers_shared.dll
            models/DeepFilterNet3_ll_onnx.tar.gz
            models/DeepFilterNet3_onnx.tar.gz
            models/silero_vad.onnx
            python/mic_eq/mic_eq_core*.pyd
          if-no-files-found: error
          retention-days: 3

  # Every test file runs exactly once: the shards in .github/pytest-shards.json
  # run their listed files and the last shard runs all other files.
  pytest:
    name: pytest (${{ matrix.shard }})
    needs: package-windows
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [voice-setup, voice-flow, auto-eq, quick-ui, tooling, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package-windows.outputs.source_revision }}
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt --no-compile
          if ($LASTEXITCODE -ne 0) { throw "Dependency install failed with exit code $LASTEXITCODE." }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: audioforge-release-runtime

      - name: Verify the packaged runtime files
        env:
          EXPECTED_NATIVE_SHA256: ${{ needs.package-windows.outputs.native_sha256 }}
        run: |
          $modules = @(Get-ChildItem -LiteralPath "python/mic_eq" -Filter "mic_eq_core*.pyd" -File)
          if ($modules.Count -ne 1 -or
              (Get-FileHash -LiteralPath $modules[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_NATIVE_SHA256) {
            throw "python/mic_eq does not hold the native module that package-windows packaged."
          }
          python python/tools/verify_release_assets.py
          if ($LASTEXITCODE -ne 0) { throw "Runtime asset verification failed with exit code $LASTEXITCODE." }

      # What an editable install provides to tests and their subprocesses.
      - name: Make the source tree importable
        run: |
          $site = python -c "import sysconfig; print(sysconfig.get_path('purelib'))"
          if ($LASTEXITCODE -ne 0) { throw "Could not locate site-packages." }
          Set-Content -LiteralPath (Join-Path $site "mic_eq.pth") -Value "$env:GITHUB_WORKSPACE\python" -Encoding ascii

      # Without the module the native tests skip instead of failing.
      - name: Verify native module
        run: python -c "import mic_eq; assert mic_eq.CORE_AVAILABLE, mic_eq._CORE_IMPORT_ERROR"

      - name: Pytest
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          $shards = Get-Content -Raw .github/pytest-shards.json | ConvertFrom-Json
          $listed = @($shards.PSObject.Properties | ForEach-Object { $_.Value })
          if ($env:SHARD -eq "rest") {
            $targets = @("python/tests") + @($listed | ForEach-Object { "--ignore=$_" })
          } else {
            $targets = @($shards.PSObject.Properties | Where-Object { $_.Name -eq $env:SHARD } | ForEach-Object { $_.Value })
            if ($targets.Count -eq 0) { throw "Unknown pytest shard $env:SHARD." }
          }
          python -m pytest @targets -q -rs --durations=15

  rust-tests:
    name: Rust tests and lint
    needs: package-windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package-windows.outputs.source_revision }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements/runtime.txt

      # With DeepFilter hydrated, the simulator tests embed the base interpreter,
      # which has no packages of its own; PYTHONPATH points it at this environment.
      - name: Install the locked runtime for the native Python bridge tests
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "Python 3.13 virtual environment creation failed." }
          .\.venv\Scripts\python.exe -m pip install --require-hashes -r requirements/runtime.txt --no-compile
          if ($LASTEXITCODE -ne 0) { throw "Runtime dependency install failed with exit code $LASTEXITCODE." }

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned 1.94.0
        with:
          toolchain: 1.94.0

      # Test binaries are not shipped, so this cache may share ci.yml's key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-rust-test-v1-py313-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'Cargo.toml', 'rust-core/Cargo.toml') }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: audioforge-release-runtime

      - name: Verify the packaged runtime files
        env:
          EXPECTED_NATIVE_SHA256: ${{ needs.package-windows.outputs.native_sha256 }}
        run: |
          $modules = @(Get-ChildItem -LiteralPath "python/mic_eq" -Filter "mic_eq_core*.pyd" -File)
          if ($modules.Count -ne 1 -or
              (Get-FileHash -LiteralPath $modules[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_NATIVE_SHA256) {
            throw "python/mic_eq does not hold the native module that package-windows packaged."
          }
          python python/tools/verify_release_assets.py
          if ($LASTEXITCODE -ne 0) { throw "Runtime asset verification failed with exit code $LASTEXITCODE." }

      # The seeded contention stress test runs in the rust-stress job, in
      # release mode; this debug run skips only that one test.
      - name: Rust tests
        env:
          PYTHONPATH: ${{ github.workspace }}\.venv\Lib\site-packages;${{ github.workspace }}\python
        run: cargo test --locked -p mic_eq_core -- --skip seeded_control_and_dsp_loops_remain_finite_under_contention --exact

      - name: Clippy
        run: cargo clippy --locked -p mic_eq_core --all-targets -- -D warnings

  # The only run of the seeded control/DSP contention stress test.
  rust-stress:
    name: Rust contention stress (release mode)
    needs: package-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package-windows.outputs.source_revision }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned 1.94.0
        with:
          toolchain: 1.94.0

      # Test binaries are not shipped, so this cache may share ci.yml's key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-rust-stress-v1-py313-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'Cargo.toml', 'rust-core/Cargo.toml') }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: audioforge-release-runtime

      - name: Verify the packaged runtime files
        env:
          EXPECTED_NATIVE_SHA256: ${{ needs.package-windows.outputs.native_sha256 }}
        run: |
          $modules = @(Get-ChildItem -LiteralPath "python/mic_eq" -Filter "mic_eq_core*.pyd" -File)
          if ($modules.Count -ne 1 -or
              (Get-FileHash -LiteralPath $modules[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_NATIVE_SHA256) {
            throw "python/mic_eq does not hold the native module that package-windows packaged."
          }
          python python/tools/verify_release_assets.py
          if ($LASTEXITCODE -ne 0) { throw "Runtime asset verification failed with exit code $LASTEXITCODE." }

      - name: Release-mode control/DSP contention stress
        run: cargo test --release --locked -p mic_eq_core --test stress_tests seeded_control_and_dsp_loops_remain_finite_under_contention

  validate-candidate:
    name: Validate the exact archived candidate
    needs: package-windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package-windows.outputs.source_revision }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: audioforge-release-candidate-${{ needs.package-windows.outputs.release_tag }}
          path: candidate

      - name: Install pinned validation runtime
        run: |
          python -m pip install --require-hashes -r requirements/runtime.txt --no-compile
          if ($LASTEXITCODE -ne 0) { throw "Validation runtime installation failed." }

      - name: Verify, extract, and smoke-test exact candidate
        env:
          EXPECTED_NATIVE_SHA256: ${{ needs.package-windows.outputs.native_sha256 }}
        run: |
          $archive = Resolve-Path "candidate/${{ needs.package-windows.outputs.archive }}"
          $checksum = Resolve-Path "candidate/${{ needs.package-windows.outputs.checksum }}"
          $manifest = Resolve-Path "candidate/${{ needs.package-windows.outputs.manifest }}"
          $metadata = Resolve-Path "candidate/${{ needs.package-windows.outputs.metadata }}"
          $installer = Resolve-Path "candidate/${{ needs.package-windows.outputs.installer }}"
          $installerChecksum = Resolve-Path "candidate/${{ needs.package-windows.outputs.installer_checksum }}"
          $installerManifest = Resolve-Path "candidate/${{ needs.package-windows.outputs.installer_manifest }}"
          $installerMetadata = Resolve-Path "candidate/${{ needs.package-windows.outputs.installer_metadata }}"
          $sourceArchive = Resolve-Path "candidate/${{ needs.package-windows.outputs.source_archive }}"
          $sourceChecksum = Resolve-Path "candidate/${{ needs.package-windows.outputs.source_checksum }}"
          $sourceMetadata = Resolve-Path "candidate/${{ needs.package-windows.outputs.source_metadata }}"
          $nativeAttestation = Resolve-Path "candidate/${{ needs.package-windows.outputs.native_attestation }}"
          $extract = Join-Path $env:RUNNER_TEMP "audioforge-candidate"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip/7z.exe"
          & $sevenZip x -y "-o$extract" $archive
          if ($LASTEXITCODE -ne 0) {
            throw "Candidate extraction failed with exit code $LASTEXITCODE."
          }
          # The Python tests ran on the module package-windows packaged.
          $nativeModules = @(Get-ChildItem -LiteralPath (Join-Path $extract "_internal/mic_eq") -Filter "mic_eq_core*.pyd" -File)
          if ($nativeModules.Count -ne 1 -or
              (Get-FileHash -LiteralPath $nativeModules[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_NATIVE_SHA256) {
            throw "The native module in the candidate archive is not the one the Python tests ran on."
          }
          $sourceExtract = Join-Path $env:RUNNER_TEMP "audioforge-source-candidate"
          New-Item -ItemType Directory -Force -Path $sourceExtract | Out-Null
          & $sevenZip x -y "-o$sourceExtract" $sourceArchive
          if ($LASTEXITCODE -ne 0) {
            throw "Corresponding-source extraction failed with exit code $LASTEXITCODE."
          }
          $tagCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne "${{ needs.package-windows.outputs.source_revision }}") {
            throw "Candidate validation checkout does not match its source revision."
          }
          if ($tagCommit -notmatch '^[0-9a-f]{40}$') {
            throw "Release tag does not resolve to a full commit: $tagCommit"
          }
          python python/tools/source_distribution.py verify `
            --archive $sourceArchive `
            --checksum $sourceChecksum `
            --metadata $sourceMetadata `
            --expected-version "${{ needs.package-windows.outputs.version }}" `
            --manifest licenses/source-manifest.json `
            --source-dir $sourceExtract `
            --include-runtime-assets `
            --require-receipt `
            --revision $tagCommit
          if ($LASTEXITCODE -ne 0) {
            throw "Exact-candidate corresponding-source verification failed."
          }

          python python/tools/release_provenance.py verify `
            --bundle $extract `
            --archive $archive `
            --checksum $checksum `
            --manifest $manifest `
            --metadata $metadata `
            --baseline evaluation/release-bundle-path-baseline.json `
            --native-attestation $nativeAttestation `
            --require-source-distribution
          if ($LASTEXITCODE -ne 0) {
            throw "Exact-candidate provenance verification failed."
          }
          python python/tools/release_provenance.py verify `
            --bundle $extract `
            --archive $installer `
            --checksum $installerChecksum `
            --manifest $installerManifest `
            --metadata $installerMetadata `
            --baseline evaluation/release-bundle-path-baseline.json `
            --native-attestation $nativeAttestation `
            --require-source-distribution
          if ($LASTEXITCODE -ne 0) {
            throw "Exact-candidate MSI provenance verification failed."
          }
          python python/tools/package_smoke.py --dist $extract
          if ($LASTEXITCODE -ne 0) {
            throw "Exact-candidate package smoke failed."
          }

          $exe = Join-Path $extract "AudioForge.exe"
          $process = Start-Process -FilePath $exe `
            -ArgumentList "--smoke-test" `
            -WorkingDirectory $extract `
            -WindowStyle Hidden `
            -PassThru
          $process | Wait-Process -Timeout 60
          $process.Refresh()
          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Exact-candidate EXE smoke test timed out after 60 seconds."
          }
          if ($process.ExitCode -ne 0) {
            throw "Exact-candidate EXE smoke test failed with code $($process.ExitCode)."
          }
          python python/tools/msi_smoke.py `
            --msi $installer `
            --payload $extract `
            --install-uninstall
          if ($LASTEXITCODE -ne 0) {
            throw "Exact-candidate MSI install/uninstall smoke failed."
          }

          $metadataObject = Get-Content -LiteralPath $metadata -Raw | ConvertFrom-Json
          @{
            schema_version = 1
            qualification_kind = "exact-artifact-package"
            status = "passed"
            passed = $true
            artifact = @{
              name = $metadataObject.archive.name
              sha256 = $metadataObject.archive.sha256
            }
            commit = $metadataObject.commit
            producer = @{
              repository = $env:GITHUB_REPOSITORY
              workflow = $env:GITHUB_WORKFLOW
              run_id = $env:GITHUB_RUN_ID
              run_attempt = $env:GITHUB_RUN_ATTEMPT
              event = $env:GITHUB_EVENT_NAME
              head_sha = $tagCommit
              ref = $env:GITHUB_REF
            }
            checks = @{
              provenance = "passed"
              package_smoke = "passed"
              hidden_exe_startup = "passed"
              installer_provenance = "passed"
              installer_smoke = "passed"
              installer_upgrade = "passed"
              source_distribution = "passed"
            }
          } | ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath "release-qualification.json" -Encoding utf8

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audioforge-release-validation-${{ needs.package-windows.outputs.release_tag }}
          path: release-qualification.json
          if-no-files-found: error
          retention-days: 14
