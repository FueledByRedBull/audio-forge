name: Promote release candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing final or RC Git tag, for example v1.12.0 or v1.12.0-rc.1."
        required: true
        type: string
      candidate_run_id:
        description: "Successful Release package workflow run containing the exact candidate."
        required: true
        type: string
      expected_archive_sha256:
        description: "SHA-256 approved after automated qualification."
        required: true
        type: string

concurrency:
  group: release-promote-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

# The jobs that run the candidate (the executable, the MSI, the Linux builds and
# the pinned pip packages) hold a read-only token and keep no credentials in
# their checkouts. Only publish-release can write, and it runs none of the
# candidate's code: it receives the verified files as an artifact and re-checks
# their hashes.
jobs:
  verify-candidate:
    name: Verify the candidate without publishing
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      prerelease: ${{ steps.origins.outputs.prerelease }}
      tag_commit: ${{ steps.origins.outputs.tag_commit }}
      candidate_run_attempt: ${{ steps.origins.outputs.candidate_run_attempt }}
      public_version: ${{ steps.stage.outputs.public_version }}
      asset_hashes: ${{ steps.stage.outputs.asset_hashes }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Authorize the dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHER: ${{ github.triggering_actor }}
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/master") {
            throw "This workflow runs only from refs/heads/master, not $env:GITHUB_REF."
          }
          $permission = Invoke-RestMethod `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" } `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/collaborators/$([uri]::EscapeDataString($env:DISPATCHER))/permission"
          if ($permission.role_name -notin @("admin", "maintain")) {
            throw "$env:DISPATCHER needs the admin or maintain role to run this workflow, but has '$($permission.role_name)'."
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.17"

      - name: Verify producing workflow runs and source commit
        id: origins
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          $canonicalTag = (python python/tools/release_version.py tag $env:RELEASE_TAG).Trim()
          if ($LASTEXITCODE -ne 0 -or $canonicalTag -ne $env:RELEASE_TAG) {
            throw "release_tag must be the canonical vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N tag."
          }
          $isPrerelease = (python python/tools/release_version.py prerelease $env:RELEASE_TAG).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Unable to classify release tag '$env:RELEASE_TAG'." }
          if ($env:CANDIDATE_RUN_ID -notmatch '^\d+$') {
            throw "Workflow run IDs must contain only decimal digits."
          }
          # RELEASING.md requires an annotated tag. Fetch the tag object itself,
          # not only the commit it points at, so a lightweight tag is detectable.
          $tagRef = "refs/tags/$($env:RELEASE_TAG)"
          git fetch --no-tags origin "+$tagRef`:$tagRef"
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch release tag '$env:RELEASE_TAG'." }
          if ((git cat-file -t $tagRef).Trim() -ne "tag") {
            throw "Release tag '$env:RELEASE_TAG' must be an annotated tag."
          }
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG --).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Unable to resolve release tag '$env:RELEASE_TAG'."
          }
          if ((git rev-parse HEAD).Trim() -ne $tagCommit) {
            throw "The checkout is not the release tag commit."
          }
          function Assert-WorkflowRun {
            param(
              [string]$RunId,
              [string]$ExpectedWorkflow
            )
            $json = gh run view $RunId `
              --repo $env:GITHUB_REPOSITORY `
              --json databaseId,workflowName,event,status,conclusion,headSha,attempt,jobs
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to read GitHub Actions run $RunId."
            }
            $run = $json | ConvertFrom-Json
            if ([string]$run.databaseId -ne $RunId) {
              throw "GitHub Actions run identity mismatch for $RunId."
            }
            if ($run.workflowName -ne $ExpectedWorkflow) {
              throw "Run $RunId was produced by '$($run.workflowName)', expected '$ExpectedWorkflow'."
            }
            if ($run.status -ne "completed" -or $run.conclusion -ne "success") {
              throw "Run $RunId is not a successful completed workflow run."
            }
            if ($run.headSha -notmatch '^[0-9a-fA-F]{40}$' -or
                $run.headSha.ToLowerInvariant() -ne $tagCommit.ToLowerInvariant()) {
              throw "Run $RunId did not build the release tag commit."
            }
            if ($run.event -ne "workflow_dispatch") {
              throw "Run $RunId has unsupported event '$($run.event)'."
            }
            if ([string]$run.attempt -notmatch '^\d+$' -or [int]$run.attempt -lt 1) {
              throw "Run $RunId has an invalid attempt number."
            }
            # The run succeeds only if its jobs do, but a run from a workflow that
            # lacks the Linux tests would also succeed: each must be there.
            $shards = @((Get-Content -Raw .github/pytest-shards.json | ConvertFrom-Json).PSObject.Properties.Name) + "rest"
            $required = @("Build Linux release package", "Linux Rust tests and lint") + @($shards | ForEach-Object { "linux-pytest ($_)" })
            foreach ($jobName in $required) {
              $job = @($run.jobs | Where-Object { $_.name -ceq $jobName })
              if ($job.Count -ne 1 -or $job[0].conclusion -ne "success") {
                throw "Run $RunId has no successful '$jobName' job."
              }
            }
            return $run
          }
          $candidateRun = Assert-WorkflowRun $env:CANDIDATE_RUN_ID "Release package"
          "candidate_run_id=$($candidateRun.databaseId)" >> $env:GITHUB_OUTPUT
          "candidate_run_attempt=$($candidateRun.attempt)" >> $env:GITHUB_OUTPUT
          "tag_commit=$tagCommit" >> $env:GITHUB_OUTPUT
          "prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

      - name: Install pinned validation runtime
        run: |
          python -m pip install --require-hashes -r requirements/runtime.txt --no-compile
          if ($LASTEXITCODE -ne 0) { throw "Validation runtime installation failed." }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audioforge-release-candidate-${{ inputs.release_tag }}
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audioforge-release-validation-${{ inputs.release_tag }}
          path: validation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audioforge-release-linux-${{ inputs.release_tag }}
          path: linux-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      # The seven release files are located, staged and hashed here, before the
      # MSI or the executable of the candidate runs; publish-release re-checks the
      # staged copies against the recorded hashes.
      - name: Locate the candidate files
        id: files
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $archiveName = "AudioForge-$($env:RELEASE_TAG)-win64-ultra.7z"
          $installerName = "AudioForge-$($env:RELEASE_TAG)-win64.msi"
          $sourceName = "AudioForge-$($env:RELEASE_TAG)-source.7z"
          foreach ($entry in @(
            @("archive", $archiveName),
            @("checksum", "$archiveName.sha256"),
            @("manifest", "$archiveName.manifest.json"),
            @("metadata", "$archiveName.metadata.json"),
            @("source_archive", $sourceName),
            @("source_checksum", "$sourceName.sha256"),
            @("source_metadata", "$sourceName.metadata.json"),
            @("installer", $installerName),
            @("installer_checksum", "$installerName.sha256"),
            @("installer_manifest", "$installerName.manifest.json"),
            @("installer_metadata", "$installerName.metadata.json"),
            @("native_attestation", "AudioForge-$($env:RELEASE_TAG)-deepfilter.provenance.json")
          )) {
            $file = @(Get-ChildItem -LiteralPath candidate -Filter $entry[1] -File)
            if ($file.Count -ne 1) {
              throw "Candidate artifact must contain exactly one $($entry[1])."
            }
            "$($entry[0])=$($file[0].FullName)" >> $env:GITHUB_OUTPUT
          }
          $tarballName = "AudioForge-$($env:RELEASE_TAG)-linux-x86_64.tar.gz"
          $appImageName = "AudioForge-$($env:RELEASE_TAG)-x86_64.AppImage"
          foreach ($entry in @(
            @("linux_tarball", $tarballName),
            @("linux_tarball_checksum", "$tarballName.sha256"),
            @("linux_tarball_manifest", "$tarballName.manifest.json"),
            @("linux_tarball_metadata", "$tarballName.metadata.json"),
            @("linux_appimage", $appImageName),
            @("linux_appimage_checksum", "$appImageName.sha256"),
            @("linux_appimage_manifest", "$appImageName.manifest.json"),
            @("linux_appimage_metadata", "$appImageName.metadata.json"),
            @("linux_native_attestation", "AudioForge-$($env:RELEASE_TAG)-libdf.provenance.json")
          )) {
            $file = @(Get-ChildItem -LiteralPath linux-candidate -Filter $entry[1] -File)
            if ($file.Count -ne 1) {
              throw "Linux candidate artifact must contain exactly one $($entry[1])."
            }
            "$($entry[0])=$($file[0].FullName)" >> $env:GITHUB_OUTPUT
          }

      # The Linux packages come from the same candidate run as the approved
      # archive. Their sidecars must match, and the libdf.so inside the tarball
      # must be the library its build attestation describes.
      - name: Verify the Linux candidate files
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          LINUX_TARBALL: ${{ steps.files.outputs.linux_tarball }}
          LINUX_TARBALL_CHECKSUM: ${{ steps.files.outputs.linux_tarball_checksum }}
          LINUX_APPIMAGE: ${{ steps.files.outputs.linux_appimage }}
          LINUX_APPIMAGE_CHECKSUM: ${{ steps.files.outputs.linux_appimage_checksum }}
          LINUX_NATIVE_ATTESTATION: ${{ steps.files.outputs.linux_native_attestation }}
        run: |
          foreach ($pair in @(
            @($env:LINUX_TARBALL, $env:LINUX_TARBALL_CHECKSUM),
            @($env:LINUX_APPIMAGE, $env:LINUX_APPIMAGE_CHECKSUM)
          )) {
            $hash = (Get-FileHash -LiteralPath $pair[0] -Algorithm SHA256).Hash.ToLowerInvariant()
            $listed = (Get-Content -LiteralPath $pair[1] -Raw).Trim()
            if ($listed -cne "$hash  $([IO.Path]::GetFileName($pair[0]))") {
              throw "$([IO.Path]::GetFileName($pair[1])) does not match the file it describes."
            }
          }
          $attestation = Get-Content -LiteralPath $env:LINUX_NATIVE_ATTESTATION -Raw | ConvertFrom-Json
          $attested = [string]$attestation.output.sha256
          if ($attestation.output.name -ne "libdf.so" -or $attested -notmatch '^[0-9a-fA-F]{64}$') {
            throw "The libdf.so attestation does not name a library and its SHA-256."
          }
          $member = "AudioForge-$($env:RELEASE_TAG)-linux-x86_64/AudioForge/_internal/libdf.so"
          $extractDir = Join-Path $env:RUNNER_TEMP ("audioforge-linux-libdf-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          tar -xzf $env:LINUX_TARBALL -C $extractDir $member
          if ($LASTEXITCODE -ne 0) { throw "The Linux tarball has no $member." }
          $packaged = (Get-FileHash -LiteralPath (Join-Path $extractDir $member) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($packaged -ne $attested.ToLowerInvariant()) {
            throw "The Linux tarball's libdf.so is not the library its attestation describes."
          }

      - name: Stage the release assets
        id: stage
        env:
          EXPECTED_SHA256: ${{ inputs.expected_archive_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARCHIVE: ${{ steps.files.outputs.archive }}
          CHECKSUM: ${{ steps.files.outputs.checksum }}
          MANIFEST: ${{ steps.files.outputs.manifest }}
          METADATA: ${{ steps.files.outputs.metadata }}
          INSTALLER: ${{ steps.files.outputs.installer }}
          INSTALLER_CHECKSUM: ${{ steps.files.outputs.installer_checksum }}
          INSTALLER_MANIFEST: ${{ steps.files.outputs.installer_manifest }}
          INSTALLER_METADATA: ${{ steps.files.outputs.installer_metadata }}
          SOURCE_ARCHIVE: ${{ steps.files.outputs.source_archive }}
          SOURCE_CHECKSUM: ${{ steps.files.outputs.source_checksum }}
          SOURCE_METADATA: ${{ steps.files.outputs.source_metadata }}
          NATIVE_ATTESTATION: ${{ steps.files.outputs.native_attestation }}
          LINUX_TARBALL: ${{ steps.files.outputs.linux_tarball }}
          LINUX_TARBALL_CHECKSUM: ${{ steps.files.outputs.linux_tarball_checksum }}
          LINUX_TARBALL_MANIFEST: ${{ steps.files.outputs.linux_tarball_manifest }}
          LINUX_TARBALL_METADATA: ${{ steps.files.outputs.linux_tarball_metadata }}
          LINUX_APPIMAGE: ${{ steps.files.outputs.linux_appimage }}
          LINUX_APPIMAGE_CHECKSUM: ${{ steps.files.outputs.linux_appimage_checksum }}
          LINUX_APPIMAGE_MANIFEST: ${{ steps.files.outputs.linux_appimage_manifest }}
          LINUX_APPIMAGE_METADATA: ${{ steps.files.outputs.linux_appimage_metadata }}
          LINUX_NATIVE_ATTESTATION: ${{ steps.files.outputs.linux_native_attestation }}
        run: |
          if ($env:EXPECTED_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
            throw "expected_archive_sha256 must contain exactly 64 hexadecimal characters."
          }
          if ((Get-FileHash -LiteralPath $env:ARCHIVE -Algorithm SHA256).Hash.ToLowerInvariant() -ne ($env:EXPECTED_SHA256).ToLowerInvariant()) {
            throw "The portable archive is not the one approved by expected_archive_sha256."
          }
          $publicVersion = (python python/tools/release_version.py pep440 $env:RELEASE_TAG).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($publicVersion)) {
            throw "Unable to resolve the public release version for notes."
          }
          $evidenceDir = Join-Path $env:RUNNER_TEMP ("audioforge-release-evidence-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          if (-not (Test-Path -LiteralPath "validation/release-qualification.json" -PathType Leaf)) {
            throw "Automated qualification evidence is missing."
          }
          Copy-Item -LiteralPath "validation/release-qualification.json" -Destination $evidenceDir
          foreach ($sidecar in @(
            $env:CHECKSUM, $env:MANIFEST, $env:METADATA,
            $env:INSTALLER_CHECKSUM, $env:INSTALLER_MANIFEST, $env:INSTALLER_METADATA,
            $env:SOURCE_CHECKSUM, $env:SOURCE_METADATA, $env:NATIVE_ATTESTATION,
            $env:LINUX_TARBALL_CHECKSUM, $env:LINUX_TARBALL_MANIFEST, $env:LINUX_TARBALL_METADATA,
            $env:LINUX_APPIMAGE_CHECKSUM, $env:LINUX_APPIMAGE_MANIFEST, $env:LINUX_APPIMAGE_METADATA,
            $env:LINUX_NATIVE_ATTESTATION
          )) {
            Copy-Item -LiteralPath $sidecar -Destination $evidenceDir -ErrorAction Stop
          }
          $stageDir = "verified-release"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip/7z.exe"
          if (-not (Test-Path -LiteralPath $sevenZip)) { $sevenZip = "7z.exe" }
          $evidenceArchive = Join-Path $stageDir "AudioForge-$($env:RELEASE_TAG)-evidence.7z"
          & $sevenZip a -t7z -mx=9 -mtc=off -mta=off -mtm=off $evidenceArchive (Join-Path $evidenceDir "*")
          if ($LASTEXITCODE -ne 0) {
            throw "Release evidence archive failed with exit code $LASTEXITCODE."
          }
          $staged = @($env:ARCHIVE, $env:INSTALLER, $env:SOURCE_ARCHIVE, $env:LINUX_TARBALL, $env:LINUX_APPIMAGE) | ForEach-Object {
            Copy-Item -LiteralPath $_ -Destination $stageDir -PassThru -ErrorAction Stop
          }
          $assetPaths = @($staged.FullName) + @($evidenceArchive)
          $checksumsFile = Join-Path $stageDir "AudioForge-$($env:RELEASE_TAG)-SHA256SUMS.txt"
          $assetPaths | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($_))"
          } | Set-Content -LiteralPath $checksumsFile -Encoding ascii
          $hashes = [ordered]@{}
          foreach ($file in Get-ChildItem -LiteralPath $stageDir -File) {
            $hashes[$file.Name] = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          "public_version=$publicVersion" >> $env:GITHUB_OUTPUT
          "asset_hashes=$($hashes | ConvertTo-Json -Compress)" >> $env:GITHUB_OUTPUT

      # Retention outlasts an environment approval that waits for days; once it
      # expires the publish job fails and the candidate is promoted again.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audioforge-verified-release-${{ inputs.release_tag }}
          path: verified-release
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Verify exact candidate and automated qualification binding
        env:
          EXPECTED_SHA256: ${{ inputs.expected_archive_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_RUN_ID: ${{ steps.origins.outputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ steps.origins.outputs.candidate_run_attempt }}
          TAG_COMMIT: ${{ steps.origins.outputs.tag_commit }}
          EXPECTED_PRERELEASE: ${{ steps.origins.outputs.prerelease }}
          ARCHIVE: ${{ steps.files.outputs.archive }}
          CHECKSUM: ${{ steps.files.outputs.checksum }}
          MANIFEST: ${{ steps.files.outputs.manifest }}
          METADATA: ${{ steps.files.outputs.metadata }}
          INSTALLER: ${{ steps.files.outputs.installer }}
          INSTALLER_CHECKSUM: ${{ steps.files.outputs.installer_checksum }}
          INSTALLER_MANIFEST: ${{ steps.files.outputs.installer_manifest }}
          INSTALLER_METADATA: ${{ steps.files.outputs.installer_metadata }}
          SOURCE_ARCHIVE: ${{ steps.files.outputs.source_archive }}
          SOURCE_CHECKSUM: ${{ steps.files.outputs.source_checksum }}
          SOURCE_METADATA: ${{ steps.files.outputs.source_metadata }}
          NATIVE_ATTESTATION: ${{ steps.files.outputs.native_attestation }}
        run: |
          $canonicalTag = (python python/tools/release_version.py tag $env:RELEASE_TAG).Trim()
          if ($LASTEXITCODE -ne 0 -or $canonicalTag -ne $env:RELEASE_TAG) {
            throw "release_tag must be the canonical vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N tag."
          }
          if ($env:EXPECTED_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
            throw "expected_archive_sha256 must contain exactly 64 hexadecimal characters."
          }
          $archive = Get-Item -LiteralPath $env:ARCHIVE
          $checksum = Get-Item -LiteralPath $env:CHECKSUM
          $manifest = Get-Item -LiteralPath $env:MANIFEST
          $metadata = Get-Item -LiteralPath $env:METADATA
          $sourceArchive = Get-Item -LiteralPath $env:SOURCE_ARCHIVE
          $sourceChecksum = Get-Item -LiteralPath $env:SOURCE_CHECKSUM
          $sourceMetadata = Get-Item -LiteralPath $env:SOURCE_METADATA
          $installer = Get-Item -LiteralPath $env:INSTALLER
          $installerChecksum = Get-Item -LiteralPath $env:INSTALLER_CHECKSUM
          $installerManifest = Get-Item -LiteralPath $env:INSTALLER_MANIFEST
          $installerMetadata = Get-Item -LiteralPath $env:INSTALLER_METADATA
          $nativeAttestation = Get-Item -LiteralPath $env:NATIVE_ATTESTATION

          $extract = Join-Path $env:RUNNER_TEMP "audioforge-promoted-candidate"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip/7z.exe"
          & $sevenZip x -y "-o$extract" $archive.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Candidate extraction failed with exit code $LASTEXITCODE."
          }
          $sourceExtract = Join-Path $env:RUNNER_TEMP "audioforge-promoted-source"
          New-Item -ItemType Directory -Force -Path $sourceExtract | Out-Null
          & $sevenZip x -y "-o$sourceExtract" $sourceArchive.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Corresponding-source extraction failed with exit code $LASTEXITCODE."
          }

          $tagCommit = git rev-list -n 1 $env:RELEASE_TAG --
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagCommit)) {
            throw "Unable to resolve release tag '$env:RELEASE_TAG'."
          }
          $expectedVersion = (python python/tools/release_version.py pep440 $env:RELEASE_TAG).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($expectedVersion)) {
            throw "Unable to resolve the public version for '$env:RELEASE_TAG'."
          }
          python python/tools/source_distribution.py verify `
            --archive $sourceArchive.FullName `
            --checksum $sourceChecksum.FullName `
            --metadata $sourceMetadata.FullName `
            --expected-version $expectedVersion `
            --manifest licenses/source-manifest.json `
            --source-dir $sourceExtract `
            --include-runtime-assets `
            --require-receipt `
            --revision $tagCommit.Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Promotion refused: corresponding-source verification failed."
          }
          python python/tools/release_provenance.py verify `
            --bundle $extract `
            --archive $archive.FullName `
            --checksum $checksum.FullName `
            --manifest $manifest.FullName `
            --metadata $metadata.FullName `
            --baseline evaluation/release-bundle-path-baseline.json `
            --expected-archive-sha256 ($env:EXPECTED_SHA256).ToLowerInvariant() `
            --expected-commit $tagCommit.Trim() `
            --expected-producer "Release package" $env:CANDIDATE_RUN_ID $env:CANDIDATE_RUN_ATTEMPT `
            --require-source-distribution `
            --native-attestation $nativeAttestation.FullName `
            --report validation/release-qualification.json
          if ($LASTEXITCODE -ne 0) {
            throw "Promotion refused: provenance or automated qualification binding failed."
          }
          python python/tools/release_provenance.py verify `
            --bundle $extract `
            --archive $installer.FullName `
            --checksum $installerChecksum.FullName `
            --manifest $installerManifest.FullName `
            --metadata $installerMetadata.FullName `
            --baseline evaluation/release-bundle-path-baseline.json `
            --expected-commit $tagCommit.Trim() `
            --expected-producer "Release package" $env:CANDIDATE_RUN_ID $env:CANDIDATE_RUN_ATTEMPT `
            --require-source-distribution `
            --native-attestation $nativeAttestation.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Promotion refused: MSI provenance verification failed."
          }
          python python/tools/msi_smoke.py `
            --msi $installer.FullName `
            --payload $extract `
            --install-uninstall
          if ($LASTEXITCODE -ne 0) {
            throw "Promotion refused: MSI install/uninstall smoke failed."
          }
          python python/tools/package_smoke.py --dist $extract
          if ($LASTEXITCODE -ne 0) {
            throw "Promotion refused: extracted package smoke failed."
          }
          $exe = Join-Path $extract "AudioForge.exe"
          $process = Start-Process -FilePath $exe `
            -ArgumentList "--smoke-test" `
            -WorkingDirectory $extract `
            -WindowStyle Hidden `
            -PassThru
          $process | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
          $process.Refresh()
          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Promotion refused: exact candidate EXE smoke test timed out after 60 seconds."
          }
          if ($process.ExitCode -ne 0) {
            throw "Promotion refused: exact candidate EXE smoke test failed with code $($process.ExitCode)."
          }

  # Verifies the Linux files on Linux, where their symlinks extract as they were
  # built, and runs the candidate's two Linux builds under a read-only token with
  # no credentials in the checkout, as verify-candidate does for the Windows
  # ones. Before it runs anything it re-hashes what it downloaded against the
  # digests verify-candidate staged, and it checks that the AppImage holds the
  # same bundle as the tarball.
  verify-linux-candidate:
    name: Verify the Linux candidate without publishing
    needs: verify-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Authorize the dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHER: ${{ github.triggering_actor }}
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/master") {
            throw "This workflow runs only from refs/heads/master, not $env:GITHUB_REF."
          }
          $permission = Invoke-RestMethod `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" } `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/collaborators/$([uri]::EscapeDataString($env:DISPATCHER))/permission"
          if ($permission.role_name -notin @("admin", "maintain")) {
            throw "$env:DISPATCHER needs the admin or maintain role to run this workflow, but has '$($permission.role_name)'."
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false

      - name: Confirm the checkout is the release tag commit
        env:
          TAG_COMMIT: ${{ needs.verify-candidate.outputs.tag_commit }}
        run: |
          if ($env:TAG_COMMIT -notmatch '^[0-9a-fA-F]{40}$' -or (git rev-parse HEAD).Trim() -ne $env:TAG_COMMIT) {
            throw "The checkout is not the release tag commit."
          }

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.17"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audioforge-release-linux-${{ inputs.release_tag }}
          path: linux-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      # The bytes verify-candidate staged and hashed are the ones that get
      # published; these must be the same bytes before anything here runs them.
      - name: Compare the downloaded files with the staged ones
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_HASHES: ${{ needs.verify-candidate.outputs.asset_hashes }}
        run: |
          python - "$RELEASE_TAG" <<'EOF'
          import hashlib, json, os, sys
          tag = sys.argv[1]
          staged = json.loads(os.environ["ASSET_HASHES"])
          for name in (f"AudioForge-{tag}-linux-x86_64.tar.gz", f"AudioForge-{tag}-x86_64.AppImage"):
              with open(os.path.join("linux-candidate", name), "rb") as handle:
                  digest = hashlib.file_digest(handle, "sha256").hexdigest()
              if staged.get(name) != digest:
                  sys.exit(f"{name} differs from the copy verify-candidate staged and hashed.")
          EOF

      - name: Install the libraries the Linux app starts with
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2t64 libdbus-1-3 libegl1 libfontconfig1 libfreetype6 libgl1 \
            libglib2.0-0t64 libgssapi-krb5-2 libpipewire-0.3-0t64 libpulse0 libxkbcommon0

      - name: Verify the Linux tarball and AppImage
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.verify-candidate.outputs.candidate_run_attempt }}
          TAG_COMMIT: ${{ needs.verify-candidate.outputs.tag_commit }}
        run: |
          set -euo pipefail
          candidate="$PWD/linux-candidate"
          tarball="$candidate/AudioForge-$RELEASE_TAG-linux-x86_64.tar.gz"
          appimage="$candidate/AudioForge-$RELEASE_TAG-x86_64.AppImage"
          tarball_root="$RUNNER_TEMP/audioforge-linux-candidate"
          appimage_root="$RUNNER_TEMP/audioforge-linux-appimage"
          mkdir -p "$tarball_root" "$appimage_root"
          tar -xzf "$tarball" -C "$tarball_root"
          # The runtime extracts the image itself, so no FUSE is needed.
          chmod +x "$appimage"
          (cd "$appimage_root" && "$appimage" --appimage-extract > /dev/null)
          verify() {
            python python/tools/release_provenance.py verify \
              --bundle "$1" \
              --archive "$2" \
              --checksum "$2.sha256" \
              --manifest "$2.manifest.json" \
              --metadata "$2.metadata.json" \
              --baseline evaluation/release-bundle-path-baseline-linux.json \
              --expected-commit "$TAG_COMMIT" \
              --expected-producer "Release package" "$CANDIDATE_RUN_ID" "$CANDIDATE_RUN_ATTEMPT" \
              --require-source-distribution \
              --native-attestation "$candidate/AudioForge-$RELEASE_TAG-libdf.provenance.json"
          }
          verify "$tarball_root/AudioForge-$RELEASE_TAG-linux-x86_64/AudioForge" "$tarball"
          verify "$appimage_root/squashfs-root/usr/lib/audioforge" "$appimage"
          # Each manifest matches the bundle extracted from its own file, so equal
          # file lists mean the AppImage holds the tarball's bundle.
          python - "$tarball.manifest.json" "$appimage.manifest.json" <<'EOF'
          import json, sys
          tarball, appimage = (json.load(open(path, encoding="utf-8")) for path in sys.argv[1:])
          if tarball["files"] != appimage["files"]:
              sys.exit("The AppImage does not hold the same bundle as the tarball.")
          EOF

      # The candidate runs only now, after its bytes were matched to the staged
      # ones and its sidecars verified.
      - name: Smoke-test the Linux tarball and AppImage
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          timeout 90 "$RUNNER_TEMP/audioforge-linux-candidate/AudioForge-$RELEASE_TAG-linux-x86_64/AudioForge/AudioForge" --smoke-test
          timeout 90 "$PWD/linux-candidate/AudioForge-$RELEASE_TAG-x86_64.AppImage" --appimage-extract-and-run --smoke-test

  # The only job that can write. The environment is a second lock beside the
  # dispatch check: repository settings limit it to master. It never runs the
  # candidate's code, so a flaw in the candidate cannot reach the write token.
  publish-release:
    name: Publish the verified release
    needs: [verify-candidate, verify-linux-candidate]
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Authorize the dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHER: ${{ github.triggering_actor }}
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/master") {
            throw "This workflow runs only from refs/heads/master, not $env:GITHUB_REF."
          }
          $permission = Invoke-RestMethod `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" } `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/collaborators/$([uri]::EscapeDataString($env:DISPATCHER))/permission"
          if ($permission.role_name -notin @("admin", "maintain")) {
            throw "$env:DISPATCHER needs the admin or maintain role to run this workflow, but has '$($permission.role_name)'."
          }

      # The workflow revision, only for its release notes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audioforge-verified-release-${{ inputs.release_tag }}
          path: verified-release

      - name: Re-check the verified assets
        id: verified
        env:
          EXPECTED_SHA256: ${{ inputs.expected_archive_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_HASHES: ${{ needs.verify-candidate.outputs.asset_hashes }}
        run: |
          if ($env:EXPECTED_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
            throw "expected_archive_sha256 must contain exactly 64 hexadecimal characters."
          }
          $tag = $env:RELEASE_TAG
          $expectedNames = [ordered]@{
            archive = "AudioForge-$tag-win64-ultra.7z"
            installer = "AudioForge-$tag-win64.msi"
            source_archive = "AudioForge-$tag-source.7z"
            linux_tarball = "AudioForge-$tag-linux-x86_64.tar.gz"
            linux_appimage = "AudioForge-$tag-x86_64.AppImage"
            evidence_archive = "AudioForge-$tag-evidence.7z"
            checksums = "AudioForge-$tag-SHA256SUMS.txt"
          }
          $recorded = $env:ASSET_HASHES | ConvertFrom-Json
          $files = @(Get-ChildItem -LiteralPath verified-release -File)
          foreach ($actual in @(@($recorded.PSObject.Properties.Name), @($files.Name))) {
            if (@(Compare-Object -ReferenceObject @($expectedNames.Values) -DifferenceObject $actual -CaseSensitive).Count -gt 0) {
              throw "The verified release artifact does not hold exactly the seven release files of $tag."
            }
          }
          $hashes = @{}
          foreach ($file in $files) {
            $hashes[$file.Name] = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hashes[$file.Name] -ne $recorded.($file.Name)) {
              throw "Verified asset '$($file.Name)' differs from the hash recorded by the verification job."
            }
          }
          $assets = [ordered]@{}
          foreach ($kind in $expectedNames.Keys) {
            $assets[$kind] = $files | Where-Object { $_.Name -ceq $expectedNames[$kind] }
          }
          if ($hashes[$expectedNames.archive] -ne ($env:EXPECTED_SHA256).ToLowerInvariant()) {
            throw "The portable archive is not the one approved by expected_archive_sha256."
          }
          $listed = @(Get-Content -LiteralPath $assets.checksums.FullName)
          $wanted = @("archive", "installer", "source_archive", "linux_tarball", "linux_appimage", "evidence_archive") | ForEach-Object {
            "$($hashes[$expectedNames[$_]])  $($expectedNames[$_])"
          }
          if (@(Compare-Object -ReferenceObject $wanted -DifferenceObject $listed -CaseSensitive).Count -gt 0) {
            throw "SHA256SUMS does not list the verified assets."
          }
          foreach ($kind in $assets.Keys) {
            "$kind=$($assets[$kind].FullName)" >> $env:GITHUB_OUTPUT
          }

      - name: Upload exact validated assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARCHIVE: ${{ steps.verified.outputs.archive }}
          INSTALLER: ${{ steps.verified.outputs.installer }}
          SOURCE_ARCHIVE: ${{ steps.verified.outputs.source_archive }}
          LINUX_TARBALL: ${{ steps.verified.outputs.linux_tarball }}
          LINUX_APPIMAGE: ${{ steps.verified.outputs.linux_appimage }}
          EVIDENCE_ARCHIVE: ${{ steps.verified.outputs.evidence_archive }}
          CHECKSUMS: ${{ steps.verified.outputs.checksums }}
          PUBLIC_VERSION: ${{ needs.verify-candidate.outputs.public_version }}
          EXPECTED_PRERELEASE: ${{ needs.verify-candidate.outputs.prerelease }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $baseVersion = $env:PUBLIC_VERSION -replace 'rc\d+$', ''
          if ($env:GITHUB_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Workflow revision is not a full commit SHA."
          }
          $notesFile = $null
          $notesContent = $null
          foreach ($notesCandidate in @(
            "release-notes/release-notes-v$version.md",
            "release-notes/release-notes-v$baseVersion.md"
          )) {
            $candidateContent = git show (("{0}:{1}" -f $env:GITHUB_SHA, $notesCandidate)) 2>$null
            if ($LASTEXITCODE -eq 0 -and $candidateContent) {
              $notesFile = $notesCandidate
              $notesContent = $candidateContent
              break
            }
          }
          if (-not $notesFile) {
            throw "Release notes are missing from workflow revision $env:GITHUB_SHA for $env:RELEASE_TAG."
          }
          $notesPath = Join-Path $env:RUNNER_TEMP (Split-Path -Leaf $notesFile)
          $notesContent | Set-Content -LiteralPath $notesPath -Encoding utf8
          $expectedPrerelease = $env:EXPECTED_PRERELEASE -eq "true"
          $assetPaths = @(
            $env:ARCHIVE, $env:INSTALLER, $env:SOURCE_ARCHIVE,
            $env:LINUX_TARBALL, $env:LINUX_APPIMAGE, $env:EVIDENCE_ARCHIVE, $env:CHECKSUMS
          )
          foreach ($assetPath in $assetPaths) {
            if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
              throw "Validated release asset is missing: $assetPath"
            }
          }

          $releaseJson = gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json isDraft,isPrerelease,assets 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          if (-not $releaseExists) {
            $createArgs = @(
              "release", "create", $env:RELEASE_TAG,
              "--repo", $env:GITHUB_REPOSITORY,
              "--verify-tag", "--draft",
              "--title", "AudioForge $version",
              "--notes-file", $notesPath
            )
            if ($expectedPrerelease) { $createArgs += "--prerelease" }
            gh @createArgs
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create draft GitHub Release '$env:RELEASE_TAG'."
            }
            $releaseJson = gh release view $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --json isDraft,isPrerelease,assets
            if ($LASTEXITCODE -ne 0) {
              throw "Draft GitHub Release '$env:RELEASE_TAG' could not be read after creation."
            }
          }
          $release = $releaseJson | ConvertFrom-Json
          if ([bool]$release.isPrerelease -ne $expectedPrerelease) {
            throw "Release '$env:RELEASE_TAG' has an unexpected prerelease state."
          }
          if ($release.isDraft) {
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title "AudioForge $version" --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) {
              throw "Draft release '$env:RELEASE_TAG' title and notes could not be synchronized."
            }
          }

          function Get-ReleaseAssets {
            param([object]$Release)
            $assets = @{}
            foreach ($asset in @($Release.assets)) {
              if ($null -ne $asset.name) {
                $assets[[string]$asset.name] = $asset
              }
            }
            return $assets
          }
          function Assert-ReleaseAssetNames {
            param(
              [object]$Release,
              [string[]]$ExpectedNames,
              [switch]$AllowMissing
            )
            $actualNames = @($Release.assets | ForEach-Object { [string]$_.name })
            $differences = @(
              Compare-Object -ReferenceObject $ExpectedNames -DifferenceObject $actualNames -CaseSensitive
            )
            $unexpected = @($differences | Where-Object SideIndicator -eq "=>")
            $missing = @($differences | Where-Object SideIndicator -eq "<=")
            if ($unexpected.Count -gt 0 -or (-not $AllowMissing -and $missing.Count -gt 0)) {
              $details = @()
              if ($unexpected.Count -gt 0) {
                $details += "unexpected: $(@($unexpected | ForEach-Object InputObject) -join ', ')"
              }
              if (-not $AllowMissing -and $missing.Count -gt 0) {
                $details += "missing: $(@($missing | ForEach-Object InputObject) -join ', ')"
              }
              throw "Release '$env:RELEASE_TAG' asset names do not match the validated candidate ($($details -join '; '))."
            }
          }
          function Assert-AssetMatches {
            param(
              [string]$LocalPath,
              [string]$RemotePath,
              [string]$AssetName
            )
            if (-not (Test-Path -LiteralPath $RemotePath -PathType Leaf)) {
              throw "Release asset '$AssetName' could not be downloaded for verification."
            }
            $localHash = (Get-FileHash -LiteralPath $LocalPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $remoteHash = (Get-FileHash -LiteralPath $RemotePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($localHash -ne $remoteHash) {
              throw "Existing release asset '$AssetName' differs from the validated candidate."
            }
          }

          $verifyDir = Join-Path $env:RUNNER_TEMP ("audioforge-release-assets-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $verifyDir | Out-Null
          $expectedAssetNames = @($assetPaths | ForEach-Object { [IO.Path]::GetFileName($_) })
          $remoteAssets = Get-ReleaseAssets $release
          Assert-ReleaseAssetNames $release $expectedAssetNames -AllowMissing
          $toUpload = @()
          foreach ($assetPath in $assetPaths) {
            $assetName = [IO.Path]::GetFileName($assetPath)
            if ($remoteAssets.ContainsKey($assetName)) {
              $localHash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
              $remoteDigest = [string]$remoteAssets[$assetName].digest
              if ($remoteDigest -notmatch '^sha256:[0-9a-fA-F]{64}$' -or
                  $remoteDigest.ToLowerInvariant() -ne "sha256:$localHash") {
                throw "Existing release asset '$assetName' has a missing or mismatched SHA-256 digest."
              }
            } else {
              $toUpload += $assetPath
            }
          }
          if ($toUpload.Count -gt 0) {
            gh release upload $env:RELEASE_TAG @toUpload --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload missing exact validated release assets."
            }
          }

          $releaseJson = gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) {
            throw "Release '$env:RELEASE_TAG' could not be read after asset upload."
          }
          $release = $releaseJson | ConvertFrom-Json
          if ([bool]$release.isPrerelease -ne $expectedPrerelease) {
            throw "Release '$env:RELEASE_TAG' changed prerelease state during promotion."
          }
          Assert-ReleaseAssetNames $release $expectedAssetNames
          foreach ($assetPath in $assetPaths) {
            $assetName = [IO.Path]::GetFileName($assetPath)
            gh release download $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --pattern $assetName `
              --dir $verifyDir `
              --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to re-read release asset '$assetName' for final verification."
            }
            Assert-AssetMatches $assetPath (Join-Path $verifyDir $assetName) $assetName
          }
          if ($release.isDraft) {
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false
            if ($LASTEXITCODE -ne 0) {
              throw "Validated release '$env:RELEASE_TAG' could not be published."
            }
          }
