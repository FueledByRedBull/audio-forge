name: Promote release candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing Git tag and target GitHub Release, for example v1.10.2."
        required: true
        type: string
      candidate_run_id:
        description: "Successful Release package workflow run containing the exact candidate."
        required: true
        type: string
      hardware_matrix_run_id:
        description: "Successful complete hardware-matrix workflow run for the exact candidate."
        required: true
        type: string
      expected_archive_sha256:
        description: "SHA-256 approved after automated and hardware qualification."
        required: true
        type: string

concurrency:
  group: release-promote-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote-release:
    name: Verify and promote without rebuilding
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: audioforge-release-candidate-${{ inputs.release_tag }}
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: audioforge-release-validation-${{ inputs.release_tag }}
          path: validation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: audioforge-release-hardware-matrix-${{ inputs.release_tag }}
          path: hardware-matrix
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.hardware_matrix_run_id }}

      - name: Verify exact candidate and both qualification bindings
        id: candidate
        env:
          EXPECTED_SHA256: ${{ inputs.expected_archive_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "release_tag must be an exact vMAJOR.MINOR.PATCH tag."
          }
          if ($env:EXPECTED_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
            throw "expected_archive_sha256 must contain exactly 64 hexadecimal characters."
          }
          $archive = Get-ChildItem -LiteralPath candidate -Filter "*.7z" -File
          $checksum = Get-ChildItem -LiteralPath candidate -Filter "*.7z.sha256" -File
          $manifest = Get-ChildItem -LiteralPath candidate -Filter "*.7z.manifest.json" -File
          $metadata = Get-ChildItem -LiteralPath candidate -Filter "*.7z.metadata.json" -File
          if (
            @($archive).Count -ne 1 -or
            @($checksum).Count -ne 1 -or
            @($manifest).Count -ne 1 -or
            @($metadata).Count -ne 1
          ) {
            throw "Candidate artifact must contain exactly one archive and each provenance sidecar."
          }

          $extract = Join-Path $env:RUNNER_TEMP "audioforge-promoted-candidate"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip/7z.exe"
          & $sevenZip x -y "-o$extract" $archive.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Candidate extraction failed with exit code $LASTEXITCODE."
          }

          $tagCommit = git rev-list -n 1 -- $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagCommit)) {
            throw "Unable to resolve release tag '$env:RELEASE_TAG'."
          }
          python python/tools/release_provenance.py verify `
            --bundle $extract `
            --archive $archive.FullName `
            --checksum $checksum.FullName `
            --manifest $manifest.FullName `
            --metadata $metadata.FullName `
            --baseline evaluation/release-bundle-path-baseline.json `
            --expected-archive-sha256 ($env:EXPECTED_SHA256).ToLowerInvariant() `
            --expected-commit $tagCommit.Trim() `
            --report validation/release-qualification.json `
            --report hardware-matrix/release-hardware-matrix.json
          if ($LASTEXITCODE -ne 0) {
            throw "Promotion refused: provenance, automated qualification, or hardware qualification binding failed."
          }
          python python/tools/package_smoke.py --dist $extract
          if ($LASTEXITCODE -ne 0) {
            throw "Promotion refused: extracted package smoke failed."
          }

          "archive=$($archive.FullName)" >> $env:GITHUB_OUTPUT
          "checksum=$($checksum.FullName)" >> $env:GITHUB_OUTPUT
          "manifest=$($manifest.FullName)" >> $env:GITHUB_OUTPUT
          "metadata=$($metadata.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload exact validated assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARCHIVE: ${{ steps.candidate.outputs.archive }}
          CHECKSUM: ${{ steps.candidate.outputs.checksum }}
          MANIFEST: ${{ steps.candidate.outputs.manifest }}
          METADATA: ${{ steps.candidate.outputs.metadata }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $notesFile = "release-notes/release-notes-v$version.md"
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --title "AudioForge $version" `
              --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub Release '$env:RELEASE_TAG'."
            }
          }
          gh release upload $env:RELEASE_TAG `
            $env:ARCHIVE `
            $env:CHECKSUM `
            $env:MANIFEST `
            $env:METADATA `
            --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload exact validated release assets; existing asset names are never overwritten implicitly."
          }
