[workspace]
resolver = "2"
members = ["libDF"]

[profile.release]
debug = false
opt-level = 3
lto = "thin"

[profile.release-lto]
inherits = "release"
debug = false
lto = "fat"
strip = true
# The patched C API catches its own panics, which needs unwinding.
panic = "unwind"
[patch.crates-io]
tract-linalg = { path = 'patches/tract-linalg' }
