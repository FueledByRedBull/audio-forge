[package]
name = "mic_eq_core"
version = "1.19.0"
edition = "2021"
rust-version = "1.94"
description = "High-performance DSP engine for AudioForge - real-time noise suppression and equalization"
license = "MIT"
build = "build.rs"

[lib]
name = "mic_eq_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
rubato = "0.14"  # High-quality resampling

# Noise suppression (RNNoise)
nnnoiseless = { version = "0.5", default-features = false }

# Noise suppression (DeepFilterNet) - optional, C FFI approach
# Uses C API via FFI to avoid Rc/Send issues with Rust libDF crate
# No direct Rust dependency - links against pre-built DeepFilterNet C library
# Build instructions: See rust-core/src/dsp/deepfilter_ffi.rs

# Python bindings
pyo3 = "0.29"
numpy = "0.29"

# Lock-free ring buffers
ringbuf = "0.5.2"

# Dynamic library loading (for DeepFilterNet FFI)
libloading = { version = "0.8", optional = true }

# Audio thread optimization
no_denormals = "0.3"

# Utilities
thiserror = "1.0"

# EBU R128 loudness measurement (for auto makeup gain)
ebur128 = "0.1.3"

# VAD dependencies (optional)
ndarray = { version = "0.17", optional = true }
# ort 2.x is still published on the rc line; pin the exact version until a stable
# release exists and we intentionally validate an upgrade.
ort = {
    version = "=2.0.0-rc.11",
    optional = true,
    default-features = false,
    features = ["std", "ndarray", "tracing"],
}

# Audio I/O. Windows stays on 0.17.3: 0.18 opens WASAPI capture without
# AUTOCONVERTPCM (so no 48 kHz format on microphones that mix at another rate)
# and only raises its WASAPI thread priority under the `realtime` feature.
[target.'cfg(windows)'.dependencies]
cpal = "=0.17.3"

# Windows uses MMCSS (audio/scheduling.rs) and Linux RTKit; thread-priority covers other targets.
[target.'cfg(not(any(windows, target_os = "linux")))'.dependencies]
cpal = "=0.18.2"
thread-priority = "1.0"

# Linux loads ONNX Runtime at runtime from the path the Python package exports in
# ORT_DYLIB_PATH, so the extension carries no build-machine library path.
[target.'cfg(target_os = "linux")'.dependencies]
# Native PipeWire host (real node names, default-device following), PulseAudio as fallback.
# realtime-dbus promotes PipeWire's callback thread through RTKit.
cpal = { version = "=0.18.2", features = ["pipewire", "pulseaudio", "realtime-dbus"] }
# The virtual microphone (audio/virtual_mic.rs); the same version cpal links.
pipewire = "=0.10.1"
# Realtime scheduling for the DSP thread through RTKit, as unprivileged desktop users get it.
# The version cpal's realtime-dbus feature links, so the graph holds one copy.
audio_thread_priority = { version = "=0.35.1", default-features = false, features = ["with_dbus"] }
# The RLIMIT_RTTIME the DSP thread's busy guard follows; pipewire already enables this feature.
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
# Ignoring SIGXCPU before the first realtime promotion (audio/processor/dsp_loop.rs).
libc = "0.2"
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = ["load-dynamic"] }

[features]
default = ["vad", "deepfilter"]

# Python extension builds should enable this feature through maturin/pyproject.
# Keep it out of default Rust builds so `cargo test` links a normal test binary.
extension-module = ["pyo3/extension-module"]

# VAD (Voice Activity Detection) for noise gate
# Enables ML-based speech detection for smarter gating
# Usage: --features vad
# Requires: ONNX Runtime model file (see README)
vad = ["dep:ndarray", "dep:ort"]

# DeepFilterNet integration via C FFI (fallback: passthrough)
# Uses C API to avoid Rc/Send issues with Rust libDF crate
# Falls back to passthrough if C library is not available
# Usage: --features deepfilter
# Note: Does NOT require DeepFilterNet C library to be present at compile time
# See: rust-core/src/dsp/deepfilter_ffi.rs for runtime library loading
deepfilter = ["dep:libloading"]
